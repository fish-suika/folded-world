<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検証 — 折りたたまれた世界</title>
<style>
  body{font-family:"Yu Gothic UI",system-ui,sans-serif;background:#1c1c1e;color:#eee;padding:24px;line-height:1.7}
  h1{font-size:18px;margin-bottom:16px}
  .r{padding:4px 0;border-bottom:1px solid #333}
  .ok::before{content:"PASS ";color:#6bd07a;font-weight:bold}
  .ng::before{content:"FAIL ";color:#ff6b6b;font-weight:bold}
  .ng{color:#ffb0b0}
  .why{color:#ff8f8f;padding-left:3em;font-size:13px}
  #sum{margin-top:18px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<h1>折りたたまれた世界 — 検証</h1>
<div id="out"></div>
<div id="sum"></div>
<script>
"use strict";
"use strict";
// ===== 調整用の数値（ここだけ触れば遊び心地が変わる） =====
// 長さの単位は「マス目 1 つ = 1」。x は右、y は上。マス (cx,cy) は [cx,cx+1]×[cy,cy+1]。
const CFG = {
  hero: {
    hw: 0.32,        // 体の半分の幅
    h: 1.5,          // 体の高さ（足元が y）
    speed: 6.4,      // 走る速さ（マス/秒）
    accelG: 70,      // 地上の加速
    accelA: 42,      // 空中の加速（空中制御）
    frictionG: 80,   // 地上で止まる強さ
    gravity: 38,
    jumpV: 14.2,     // ジャンプの初速。最高到達 = jumpV^2/(2g) ≒ 2.65 マス
    cutV: 0.45,      // ジャンプボタンを離したときの上昇の減衰
    maxFall: 26,
    coyote: 0.09,    // 足場を離れても跳べる猶予
    buffer: 0.12,    // 着地前の先行入力
    deathY: -6,      // これより下に落ちたらやり直し
  },
  fold: {
    near: 9.5,       // 折り目からこの距離（マス）以内で「折る」が効く
    dur: 0.62,       // 折るアニメーションの長さ（この間は主人公も止まる）
    shakeDur: 0.4,   // 折れないときの震え
  },
  item: {
    shardR: 1.0,     // 小さな欠片を取れる距離（体の中心から）
    flagR: 1.1,      // 旗に触れる距離
    spikeH: 0.55,    // トゲの高さ（マスの下から）
  },
  solver: { stepUp: 2, maxGap: 3 },   // 検証用の「届く」判定（実物のジャンプより少し控えめ）
  cam: { fov: 36, dist: 21, smooth: 6, minY: 5.2 },
};

// ===== ワールド1（草原の紙）の3ステージ =====
// rects: 紙のマス（[x, y, 幅, 高さ]）。
// folds: 折り目。折り目 f の縦線で、幅 w・縦 y0〜y1（y1 は含まない）の「折れる耳」を
//        dir=+1 なら右側（[f, f+w)）、-1 なら左側（[f-w, f)）に持ち、主人公がいない側へパタンと折り返す。
//        耳は折り目を軸に鏡写しの位置（x → 2f-1-x）に来る。
//        back: 耳の「裏面」にだけある足場（[x, y, 幅, 高さ]、元の位置の座標）。折って裏返ったときだけ現れる。
// spikes: [x, y, 幅]。flags: チェックポイント。shards: 小さな欠片（back: 折り目の番号なら、その裏面にだけある）。
const LEVELS = [
  {
    id: '1-1', name: 'はじめの紙', hint: '折ると、遠くの紙が手前に来る',
    w: 60, h: 14,
    start: { x: 2.5, y: 2 }, goal: { x: 58.5, y: 2 },
    rects: [
      [0, 0, 16, 2],    // 地面 A
      [8, 2, 2, 3],     // 低い壁（耳 T0 の元）
      [24, 0, 26, 2],   // 地面 B（穴1の向こう）
      [41, 2, 4, 4],    // 崖（耳 T2 の元）
      [54, 0, 6, 2],    // 地面 C（穴2の向こう・ゴール）
    ],
    folds: [
      { f: 8,  w: 2, dir: 1, y0: 2, y1: 3 },   // T0 壁の足元を折って小さな段にする
      { f: 24, w: 6, dir: 1, y0: 1, y1: 2 },   // T1 向こう岸の地面の表面を板にして穴にかぶせる
      { f: 41, w: 2, dir: 1, y0: 2, y1: 4 },   // T2 崖の足元を折って階段にする
      { f: 54, w: 4, dir: 1, y0: 1, y1: 2 },   // T3 もう一度、向こう岸の板を引き寄せる
    ],
    spikes: [[36, 2, 2]],
    flags: [{ x: 33.5, y: 2 }, { x: 47.5, y: 2 }],
    shards: [{ x: 4, y: 4 }, { x: 20, y: 4 }, { x: 43, y: 8 }],
  },
  {
    id: '1-2', name: '紙のうら', hint: '折ると、裏にだけある足場が現れる',
    w: 64, h: 14,
    start: { x: 2.5, y: 2 }, goal: { x: 57.5, y: 8 },
    rects: [
      [0, 0, 15, 2],     // 地面 A
      [23, 0, 41, 2],    // 地面 B（穴の向こうからゴールの下まで）
      [40, 2, 4, 1],     // 出っ張り（耳 Tb の元）
      [50, 7, 10, 1],    // 高い所の床（ゴール）
    ],
    folds: [
      { f: 23, w: 8, dir: 1, y0: 2, y1: 3, back: [[23, 2, 8, 1]] },                    // Ta 裏面の橋
      { f: 40, w: 4, dir: 1, y0: 2, y1: 3 },                                            // Tb トゲにかぶせる板
      { f: 50, w: 4, dir: 1, y0: 3, y1: 7, back: [[52, 3, 2, 1], [50, 5, 2, 1]] },      // Tc 裏面の階段
    ],
    spikes: [[36, 2, 4]],
    flags: [{ x: 33.5, y: 2 }, { x: 46.5, y: 2 }],
    shards: [{ x: 26, y: 3, back: 0 }, { x: 37, y: 5 }, { x: 55, y: 10 }],
  },
  {
    id: '1-3', name: '折り重ねる', hint: '橋・板・階段を、順番に折っていく',
    w: 72, h: 14,
    start: { x: 2.5, y: 2 }, goal: { x: 68.5, y: 2 },
    rects: [
      [0, 0, 12, 2],     // 地面 A
      [20, 0, 16, 2],    // 地面 F1
      [42, 0, 30, 2],    // 地面 F2（ゴールまで）
      [53, 2, 3, 1],     // 出っ張り（耳 T4 の元）
    ],
    folds: [
      { f: 20, w: 8, dir: 1, y0: 3, y1: 6, back: [[26, 3, 2, 1], [24, 5, 2, 1], [22, 5, 2, 1], [20, 3, 2, 1]] },   // Td 裏面のアーチ
      { f: 42, w: 6, dir: 1, y0: 1, y1: 2 },   // T3 向こう岸の板
      { f: 53, w: 3, dir: 1, y0: 2, y1: 3 },   // T4 トゲにかぶせる板
    ],
    spikes: [[30, 2, 2], [50, 2, 3], [60, 2, 2]],
    flags: [{ x: 24.5, y: 2 }, { x: 48.5, y: 2 }],
    shards: [{ x: 16, y: 7 }, { x: 45, y: 4 }, { x: 61, y: 4 }],
  },
];
// ===== 盤面・折りのルール・主人公の物理・到達検証（three.js を使わない部分） =====
const HERO = CFG.hero;

class World {
  constructor(level) {
    this.W = level.w; this.H = level.h;
    this.base = new Uint8Array(this.W * this.H);
    for (const [x, y, w, h] of level.rects)
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.base[j * this.W + i] = 1;
    this.folds = level.folds.map(f => {
      const x0 = f.dir > 0 ? f.f : f.f - f.w;
      const back = new Set();   // 裏面にだけある足場（元の位置の座標）
      for (const [x, y, w, h] of (f.back || []))
        for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) back.add(j * this.W + i);
      return { f: f.f, w: f.w, dir: f.dir, x0, x1: x0 + f.w, y0: f.y0, y1: f.y1, back };
    });
    this.spikes = [];
    for (const [x, y, w] of (level.spikes || [])) for (let i = 0; i < w; i++) this.spikes.push({ cx: x + i, cy: y, back: -1 });
    this.shards = (level.shards || []).map(s => ({ cx: s.x, cy: s.y, back: s.back === undefined ? -1 : s.back }));
    this.flags = (level.flags || []).map(f => ({ cx: Math.floor(f.x), cy: f.y, x: f.x, y: f.y }));
    this.active = -1;   // 折っている折り目の番号（折っていなければ -1）。同時に折れるのは1か所だけ
  }
  mir(fd, cx) { return 2 * fd.f - 1 - cx; }
  inSource(fd, cx, cy) { return cx >= fd.x0 && cx < fd.x1 && cy >= fd.y0 && cy < fd.y1; }
  inTarget(fd, cx, cy) { return this.inSource(fd, this.mir(fd, cx), cy); }
  baseSolid(cx, cy) { return cx >= 0 && cx < this.W && cy >= 0 && cy < this.H && this.base[cy * this.W + cx] === 1; }
  // 耳の元の位置にある固いマス（表の紙＋裏面の足場）
  srcSolid(fd, cx, cy) {
    return this.baseSolid(cx, cy) || (cx >= 0 && cx < this.W && cy >= 0 && cy < this.H && fd.back.has(cy * this.W + cx));
  }
  // 折り状態を考慮した「そこは固い？」。紙の左右の端は見えない壁、下は落ちる
  solid(cx, cy, active = this.active) {
    if (cx < 0 || cx >= this.W) return true;
    if (cy < 0 || cy >= this.H) return false;
    let s = this.base[cy * this.W + cx] === 1;
    if (active >= 0) {
      const fd = this.folds[active];
      if (s && this.inSource(fd, cx, cy)) s = false;
      if (!s && this.inTarget(fd, cx, cy) && this.srcSolid(fd, this.mir(fd, cx), cy)) s = true;
    }
    return s;
  }
  isLayer(cx, cy) {     // 折り返された耳のマス
    if (this.active < 0) return false;
    const fd = this.folds[this.active];
    return this.inTarget(fd, cx, cy) && this.srcSolid(fd, this.mir(fd, cx), cy);
  }
  isBaseKept(cx, cy) {  // 元の位置に残っている紙のマス
    if (!this.baseSolid(cx, cy)) return false;
    return !(this.active >= 0 && this.inSource(this.folds[this.active], cx, cy));
  }
  // アイテム（トゲ・欠片）が今いるマス。裏面にだけあるものは、その折り目を折っているときだけ現れる
  itemCell(it, active = this.active) {
    if (it.back >= 0) {
      if (active !== it.back) return null;
      return [this.mir(this.folds[active], it.cx), it.cy];
    }
    if (active >= 0 && this.inSource(this.folds[active], it.cx, it.cy)) return [this.mir(this.folds[active], it.cx), it.cy];
    return [it.cx, it.cy];
  }
  // 働いているトゲのマス（板でふさがれたら働かない）
  spikeCell(sp, active = this.active) {
    const c = this.itemCell(sp, active);
    return c && !this.solid(c[0], c[1], active) ? c : null;
  }
}

// 主人公の体が重なるマスの範囲 [x0,x1,y0,y1]
function heroCells(x, y) {
  return [Math.floor(x - HERO.hw + 1e-6), Math.floor(x + HERO.hw - 1e-6),
          Math.floor(y + 1e-6), Math.floor(y + HERO.h - 1e-6)];
}

function hitsSpike(w, h) {
  for (const sp of w.spikes) {
    const c = w.spikeCell(sp);
    if (!c) continue;
    if (h.x + HERO.hw > c[0] + 0.1 && h.x - HERO.hw < c[0] + 0.9 && h.y < c[1] + CFG.item.spikeH && h.y + HERO.h > c[1]) return true;
  }
  return false;
}

// 折れる？  { ok, why }  why: far / side / active / overlap / onTab
function canFold(w, i, x, y) {
  if (w.active >= 0) return { ok: false, why: 'active' };
  const fd = w.folds[i];
  if (fd.dir > 0 ? x >= fd.f : x <= fd.f) return { ok: false, why: 'side' };   // 主人公は耳の反対側にいる
  if (Math.abs(x - fd.f) > CFG.fold.near || y < fd.y0 - 5 || y > fd.y1 + 6) return { ok: false, why: 'far' };
  const [x0, x1, y0, y1] = heroCells(x, y);
  const row = Math.floor(y - 0.05);
  for (let cx = x0; cx <= x1; cx++) {
    for (let cy = y0; cy <= y1; cy++)
      if (w.inTarget(fd, cx, cy) && w.srcSolid(fd, w.mir(fd, cx), cy)) return { ok: false, why: 'overlap' };
    if (w.inSource(fd, cx, row) && w.baseSolid(cx, row)) return { ok: false, why: 'onTab' };   // 耳の上に乗っている
  }
  return { ok: true };
}

// 戻せる？  { ok, carried, nx }  耳の上に乗っていたら、耳ごと元の位置へ運ばれる（carried）
function canUnfold(w, x, y) {
  if (w.active < 0) return { ok: false, why: 'none' };
  const fd = w.folds[w.active];
  const [x0, x1] = heroCells(x, y);
  const row = Math.floor(y - 0.05);
  let layer = false, kept = false;
  for (let cx = x0; cx <= x1; cx++) {
    if (w.isBaseKept(cx, row)) kept = true; else if (w.isLayer(cx, row)) layer = true;
  }
  const carried = layer && !kept;
  const nx = carried ? 2 * fd.f - x : x;
  const [a0, a1, b0, b1] = heroCells(nx, y);
  for (let cx = a0; cx <= a1; cx++) for (let cy = b0; cy <= b1; cy++)
    if (w.solid(cx, cy, -1)) return { ok: false, why: 'overlap' };   // 戻すと紙に埋まる
  if (carried) {   // 裏面の足場の上で戻すと、元の位置に足場がない（落ちてしまう）
    let sup = false;
    for (let cx = a0; cx <= a1; cx++) if (w.solid(cx, row, -1)) sup = true;
    if (!sup) return { ok: false, why: 'void' };
  }
  return { ok: true, carried, nx };
}

// ---- 主人公の物理（足元が y、中心が x） ----
function newHero(level, at) {
  const s = at || level.start;
  return { x: s.x, y: s.y, vx: 0, vy: 0, ground: true, face: 1, coyote: 0, buf: 0, jumping: false, jumped: false, landed: 0 };
}

// inp: { left, right, jumpHeld, jumpPressed }
function stepHero(w, h, inp, dt) {
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const target = dir * HERO.speed;
  const acc = dir !== 0 ? (h.ground ? HERO.accelG : HERO.accelA) : (h.ground ? HERO.frictionG : HERO.accelA * 0.4);
  if (h.vx < target) h.vx = Math.min(target, h.vx + acc * dt);
  else if (h.vx > target) h.vx = Math.max(target, h.vx - acc * dt);
  if (dir) h.face = dir;

  h.coyote = h.ground ? HERO.coyote : Math.max(0, h.coyote - dt);
  h.buf = inp.jumpPressed ? HERO.buffer : Math.max(0, h.buf - dt);
  h.jumped = false; h.landed = 0;
  if (h.buf > 0 && h.coyote > 0) { h.vy = HERO.jumpV; h.buf = 0; h.coyote = 0; h.ground = false; h.jumped = true; h.jumping = true; }
  if (h.jumping && !inp.jumpHeld && h.vy > 0) { h.vy *= HERO.cutV; h.jumping = false; }
  if (h.vy <= 0) h.jumping = false;
  h.vy = Math.max(-HERO.maxFall, h.vy - HERO.gravity * dt);

  // X
  let nx = h.x + h.vx * dt;
  const r = heroCells(h.x, h.y);
  if (h.vx > 0) {
    const cx = Math.floor(nx + HERO.hw);
    for (let cy = r[2]; cy <= r[3]; cy++) if (w.solid(cx, cy)) { nx = cx - HERO.hw - 1e-4; h.vx = 0; break; }
  } else if (h.vx < 0) {
    const cx = Math.floor(nx - HERO.hw);
    for (let cy = r[2]; cy <= r[3]; cy++) if (w.solid(cx, cy)) { nx = cx + 1 + HERO.hw + 1e-4; h.vx = 0; break; }
  }
  h.x = nx;

  // Y
  let ny = h.y + h.vy * dt;
  const bx0 = Math.floor(h.x - HERO.hw + 1e-6), bx1 = Math.floor(h.x + HERO.hw - 1e-6);
  const wasGround = h.ground;
  h.ground = false;
  if (h.vy <= 0) {
    const cy = Math.floor(ny);
    for (let cx = bx0; cx <= bx1; cx++) {
      if (w.solid(cx, cy) && h.y >= cy + 1 - 1e-4) {
        if (!wasGround && h.vy < -8) h.landed = Math.min(1, -h.vy / 20);
        ny = cy + 1; h.vy = 0; h.ground = true; break;
      }
    }
  } else {
    const cy = Math.floor(ny + HERO.h);
    for (let cx = bx0; cx <= bx1; cx++) if (w.solid(cx, cy)) { ny = cy - HERO.h - 1e-4; h.vy = 0; h.jumping = false; break; }
  }
  h.y = ny;
}

// ---- 到達検証：「立てるマス」の間を、歩き・ジャンプ・折る・戻すでつないで、目的に着けるか ----
function surfaces(w, cx, active) {
  const out = [];
  if (cx < 0 || cx >= w.W) return out;
  for (let y = 1; y < w.H - 2; y++)
    if (w.solid(cx, y - 1, active) && !w.solid(cx, y, active) && !w.solid(cx, y + 1, active)) out.push(y);
  return out;
}

function spikeAtNode(w, a, cx, y) {
  for (const sp of w.spikes) { const c = w.spikeCell(sp, a); if (c && c[0] === cx && (c[1] === y)) return true; }
  return false;
}

// goalFn(a, cx, y) が真になる立ち位置まで。返り値 nodes: [{a,cx,y,kind,i}]（kind: start/move/jump/fold/unfold）
function solve(w, level, opts = {}) {
  const allowFold = opts.allowFold !== false;
  const gx = level.goal.x, gy = level.goal.y;
  const goalFn = opts.goalFn || ((a, cx, y) => Math.abs(cx + 0.5 - gx) <= 1.0 && Math.abs(y - gy) <= 1);
  const key = (a, cx, y) => ((a + 1) * 100 + cx) * 100 + y;
  const sx = Math.floor(level.start.x), sy = level.start.y;
  const prev = new Map(), q = [[-1, sx, sy]];
  prev.set(key(-1, sx, sy), { from: null, node: { a: -1, cx: sx, y: sy, kind: 'start' } });
  const save = w.active;
  let found = null;
  const push = (from, a, cx, y, kind, i) => {
    const k = key(a, cx, y);
    if (prev.has(k)) return;
    if (spikeAtNode(w, a, cx, y)) return;
    prev.set(k, { from, node: { a, cx, y, kind, i } });
    q.push([a, cx, y]);
  };
  while (q.length) {
    const [a, cx, y] = q.shift();
    if (goalFn(a, cx, y)) { found = key(a, cx, y); break; }
    const from = key(a, cx, y);
    w.active = a;
    for (let dx = -CFG.solver.maxGap; dx <= CFG.solver.maxGap; dx++) {
      if (dx === 0) continue;
      const nx = cx + dx, step = Math.sign(dx);
      let blocked = false;
      for (let k = cx + step; k !== nx; k += step)
        if (w.solid(k, y + 2, a) || w.solid(k, y + 3, a)) { blocked = true; break; }
      if (blocked) continue;
      const ys = surfaces(w, nx, a).filter(v => v <= y + CFG.solver.stepUp);
      if (!ys.length) continue;
      if (Math.abs(dx) === 1) { for (const v of ys) if (v >= y - 7) push(from, a, nx, v, 'move'); }
      else push(from, a, nx, Math.max(...ys), 'jump');
    }
    if (allowFold) {
      const hx = cx + 0.5;
      if (a < 0) {
        for (let i = 0; i < w.folds.length; i++)
          if (Math.abs(hx - w.folds[i].f) <= CFG.fold.near - 0.6 && canFold(w, i, hx, y).ok) push(from, i, cx, y, "fold", i);
      } else {
        const r = canUnfold(w, hx, y);
        if (r.ok) push(from, -1, Math.floor(r.nx), y, 'unfold', a);
      }
    }
  }
  w.active = save;
  if (found === null) return { solvable: false, nodes: [], steps: [], folds: 0 };
  const nodes = [];
  for (let k = found; k !== null; k = prev.get(k).from) nodes.unshift(prev.get(k).node);
  return { solvable: true, nodes, steps: nodes.slice(1).map(n => n.kind + (n.i !== undefined ? ' ' + n.i : '')), folds: nodes.filter(n => n.kind === 'fold').length };
}

// 小さな欠片 s に、折りを使って届く立ち位置があるか
function shardGoal(w, s) {
  return (a, cx, y) => {
    const c = w.itemCell(s, a);
    if (!c) return false;
    const dy = (c[1] + 0.5) - (y + 0.75);
    return Math.abs(c[0] - cx) <= 1 && dy >= -1 && dy <= 2.2;
  };
}

// ===== 検証 =====
let pass = 0, fail = 0;
function T(name, ok, why) {
  const d = document.createElement('div');
  d.className = 'r ' + (ok ? 'ok' : 'ng');
  d.textContent = name + (ok || !why ? '' : '  — ' + why);
  document.getElementById('out').appendChild(d);
  ok ? pass++ : fail++;
}
const flat = rects => ({ id: 't', w: 40, h: 14, start: { x: 2.5, y: 2 }, goal: { x: 0, y: 0 }, folds: [], rects });

// --- 物理 ---
(function () {
  const w = new World(flat([[0, 0, 40, 2]]));
  const sim = (inp, steps, h) => { for (let i = 0; i < steps; i++) stepHero(w, h, typeof inp === 'function' ? inp(i, h) : inp, 1 / 120); return h; };
  let h = newHero(flat([]), { x: 5, y: 2 }); sim({}, 240, h);
  T('平地に立っていられる', h.ground && Math.abs(h.y - 2) < 1e-6, 'y=' + h.y);
  h = newHero(flat([]), { x: 5, y: 2 }); let maxY = 0;
  sim((i, hh) => { maxY = Math.max(maxY, hh.y); return { jumpPressed: i === 0, jumpHeld: true }; }, 240, h);
  T('フルジャンプの高さ 2.4〜2.9 マス', maxY - 2 > 2.4 && maxY - 2 < 2.9, (maxY - 2).toFixed(2));
  const hj = newHero(flat([]), { x: 5, y: 2 }); let landX = 0;
  for (let i = 0; i < 400; i++) {
    stepHero(w, hj, { right: true, jumpPressed: i === 120, jumpHeld: true }, 1 / 120);
    if (i > 125 && hj.ground) { landX = hj.x; break; }
  }
  // 走り出しの位置から、ジャンプして着地するまでの水平距離
  const hk = newHero(flat([]), { x: 5, y: 2 });
  for (let i = 0; i < 200; i++) stepHero(w, hk, { right: true }, 1 / 120);
  const jx = hk.x; let lx = 0;
  for (let i = 0; i < 300; i++) { stepHero(w, hk, { right: true, jumpPressed: i === 0, jumpHeld: true }, 1 / 120); if (i > 5 && hk.ground) { lx = hk.x; break; } }
  T('走りジャンプの距離 4.3 マス以上', lx - jx > 4.3, (lx - jx).toFixed(2));
  const w3 = new World(flat([[0, 0, 40, 2], [10, 2, 2, 3]]));
  h = newHero(flat([]), { x: 5, y: 2 });
  for (let i = 0; i < 1200; i++) stepHero(w3, h, { right: true, jumpPressed: h.ground && h.x > 8.2, jumpHeld: true }, 1 / 120);
  T('3 マスの壁は跳び越せない', h.x < 10, 'x=' + h.x.toFixed(2));
  const w2 = new World(flat([[0, 0, 40, 2], [10, 2, 2, 2]]));
  h = newHero(flat([]), { x: 5, y: 2 }); let landedOn = false;
  for (let i = 0; i < 600; i++) { stepHero(w2, h, { right: true, jumpPressed: h.ground && h.x > 8.2 && h.x < 9.5, jumpHeld: true }, 1 / 120); if (h.ground && h.x > 10 && h.x < 12 && h.y > 3.99) landedOn = true; }
  T('2 マスの段には跳び乗れる', landedOn);
})();

// --- 折りのルール（1-1） ---
(function () {
  const w = new World(LEVELS[0]);
  w.active = 1;
  let ok = true; for (let cx = 18; cx <= 23; cx++) if (!w.solid(cx, 1)) ok = false;
  T('1-1 T1 を折ると板が穴（18〜23）に架かる', ok);
  T('1-1 T1 を折ると元の位置（24〜29 の行1）は空になり行0 は残る', !w.solid(24, 1) && !w.solid(29, 1) && w.solid(24, 0));
  w.active = 2;
  T('1-1 T2 を折ると崖の足元が手前（39〜40, 行2〜3）に来る', w.solid(39, 2) && w.solid(40, 3) && !w.solid(41, 2) && w.solid(41, 4));
  w.active = 0;
  T('1-1 T0 を折ると段（6〜7, 行2）ができる', w.solid(6, 2) && w.solid(7, 2) && !w.solid(8, 2) && w.solid(8, 3));
  w.active = -1;
  T('折れない: 段の位置に立っている', !canFold(w, 2, 39.6, 2).ok && canFold(w, 2, 39.6, 2).why === 'overlap');
  T('折れる: 離れた位置から', canFold(w, 2, 36.5, 2).ok);
  T('折れない: 耳の反対側にいない', !canFold(w, 2, 43, 6).ok);
  T('折れない: 遠すぎる／近づくと折れる', !canFold(w, 1, 2.5, 2).ok && canFold(w, 1, 15.3, 2).ok);
  w.active = 1;
  const u = canUnfold(w, 20.5, 2);
  T('板の上で戻すと向こう岸（x=27.5）へ運ばれる', u.ok && u.carried && Math.abs(u.nx - 27.5) < 1e-6, JSON.stringify(u));
  const u2 = canUnfold(w, 12, 2);
  T('手前の地面で戻しても動かない', u2.ok && !u2.carried);
  w.active = 0;
  T('段の上からは壁が邪魔で戻せない', !canUnfold(w, 6.5, 3).ok);
})();

// --- 裏面・トゲ・アイテム（1-2） ---
(function () {
  const w = new World(LEVELS[1]);
  T('裏面の足場は折る前は存在しない', !w.solid(15, 2) && !w.solid(25, 2) && !w.srcSolid(w.folds[0], 25, 2) === false);
  w.active = 0;
  let ok = true; for (let cx = 15; cx <= 22; cx++) if (!w.solid(cx, 2)) ok = false;
  T('Ta を折ると裏面の橋が穴（15〜22, 行2）に現れる', ok);
  T('裏面にだけある欠片は折ったときだけ現れる', w.itemCell(w.shards[0], 0)[0] === 19 && w.itemCell(w.shards[0], -1) === null);
  // 裏面の橋の上で戻すと、元の位置に足場がない
  const u = canUnfold(w, 18.5, 3);
  T('裏面の橋の上で戻そうとすると「足場がない」で戻せない', !u.ok && u.why === 'void', JSON.stringify(u));
  const u2 = canUnfold(w, 30, 2);
  T('向こう岸（残る紙）に立っていれば戻せる', u2.ok && !u2.carried);
  w.active = -1;
  const sp = w.spikes[0];
  T('トゲは折っていないとき働く', w.spikeCell(sp, -1) !== null);
  w.active = 1;
  T('板をかぶせるとトゲは働かない', w.spikeCell(sp, 1) === null && w.solid(36, 2) && w.solid(39, 2));
  const h = newHero(LEVELS[1], { x: 36.5, y: 3 });
  T('板の上に立ってもトゲに当たらない', !hitsSpike(w, h));
  w.active = -1;
  const h2 = newHero(LEVELS[1], { x: 36.5, y: 2 });
  T('トゲの上に立つと当たる', hitsSpike(w, h2));
})();

// --- 到達検証（全ステージ） ---
for (const lv of LEVELS) {
  const w = new World(lv);
  const a = solve(w, lv), b = solve(w, lv, { allowFold: false });
  T(lv.id + ' 折らないとゴールに着けない', !b.solvable);
  T(lv.id + ' 折ればゴールに着ける', a.solvable, '');
  if (a.solvable) T(lv.id + ' 解答の折り: ' + a.folds + ' 回 [' + a.steps.join(', ') + ']', a.folds >= 1);
  lv.shards.forEach((s, i) => {
    const r = solve(w, lv, { goalFn: shardGoal(w, w.shards[i]) });
    T(lv.id + ' 欠片 ' + (i + 1) + ' に届く' + (s.back !== undefined ? '（裏面）' : ''), r.solvable);
  });
  lv.flags.forEach((f, i) => {
    const r = solve(w, lv, { goalFn: (aa, cx, y) => Math.abs(cx + 0.5 - f.x) <= 1 && y === f.y });
    T(lv.id + ' 旗 ' + (i + 1) + ' に届く', r.solvable);
  });
}

// --- 実際の物理で通しで遊ぶボット（解答の経路をたどる） ---
function runBot(lv) {
  const w = new World(lv);
  const r = solve(w, lv);
  if (!r.solvable) return { ok: false, why: 'unsolvable' };
  const h = newHero(lv), dt = 1 / 120;
  const log = [];
  let ni = 1, nodeT = 0, t = 0;
  while (ni < r.nodes.length && t < 240) {
    const nd = r.nodes[ni];
    if (nd.kind === 'fold' || nd.kind === 'unfold') {
      const ccx = r.nodes[ni - 1].cx + 0.5;   // 立っているマスの中央に寄ってから折る
      if (!h.ground || Math.abs(h.x - ccx) > 0.15) {
        const dd = ccx - h.x;
        stepHero(w, h, h.ground ? { left: dd < 0, right: dd > 0 } : {}, dt); t += dt; nodeT += dt;
        if (nodeT > 6) return { ok: false, why: "not ready for " + nd.kind + " x=" + h.x.toFixed(2), log };
        continue;
      }
      if (nd.kind === 'fold') {
        const c = canFold(w, nd.i, h.x, h.y);
        if (!c.ok) return { ok: false, why: 'cannot fold ' + nd.i + ' (' + c.why + ') x=' + h.x.toFixed(2), log };
        w.active = nd.i; log.push('fold' + nd.i + '@' + h.x.toFixed(1));
      } else {
        const c = canUnfold(w, h.x, h.y);
        if (!c.ok) return { ok: false, why: 'cannot unfold (' + c.why + ') x=' + h.x.toFixed(2), log };
        w.active = -1; if (c.carried) h.x = c.nx; log.push('unfold@' + h.x.toFixed(1));
      }
      h.vx = 0; ni++; nodeT = 0; continue;
    }
    // 歩き・ジャンプ
    const tx = nd.cx + 0.5;
    if (h.ground && Math.floor(h.x) === nd.cx && Math.abs(h.y - nd.y) < 0.05 && w.active === nd.a) { ni++; nodeT = 0; continue; }
    const dx = tx - h.x, dir = Math.abs(dx) < 0.12 ? 0 : Math.sign(dx);
    let jump = false;
    if (h.ground && dir !== 0) {
      const ahead = Math.floor(h.x + dir * 0.7), fr = Math.floor(h.y), sup = Math.floor(h.y - 0.05);
      if (w.solid(ahead, fr) || w.solid(ahead, fr + 1)) jump = true;                       // 壁
      if (!w.solid(ahead, sup) && !w.solid(ahead + dir, sup)) jump = true;                 // 穴
      for (const sp of w.spikes) { const c = w.spikeCell(sp); if (c && c[1] === fr && (c[0] === ahead || c[0] === ahead + dir)) jump = true; }   // トゲ
    }
    stepHero(w, h, { left: dir < 0, right: dir > 0, jumpPressed: jump, jumpHeld: jump || !h.ground }, dt);
    t += dt; nodeT += dt;
    if (h.y < CFG.hero.deathY) return { ok: false, why: 'fell at x=' + h.x.toFixed(1) + ' node ' + ni + ' ' + JSON.stringify(nd), log };
    if (hitsSpike(w, h)) return { ok: false, why: 'spike at x=' + h.x.toFixed(1) + ' node ' + ni, log };
    if (nodeT > 8) return { ok: false, why: 'stuck at x=' + h.x.toFixed(1) + ' y=' + h.y.toFixed(1) + ' node ' + ni + ' ' + JSON.stringify(nd), log };
  }
  const reached = Math.abs(h.x - lv.goal.x) < 1.6 && Math.abs(h.y - lv.goal.y) < 1.2;
  return { ok: reached, why: reached ? '' : 'end at x=' + h.x.toFixed(1) + ' y=' + h.y.toFixed(1), log, t };
}
for (const lv of LEVELS) {
  const r = runBot(lv);
  T(lv.id + ' ボットが実際の物理でゴールに着く' + (r.t ? '（' + r.t.toFixed(1) + ' 秒）' : ''), r.ok, r.why + ' ' + (r.log || []).join(' '));
}

document.getElementById('sum').textContent = `${pass} PASS / ${fail} FAIL`;
document.title = (fail ? 'FAIL ' : 'OK ') + pass + '/' + (pass + fail);

</script>
</body>
