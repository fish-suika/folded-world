<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検証 — 折りたたまれた世界</title>
<style>
  body{font-family:"Yu Gothic UI",system-ui,sans-serif;background:#1c1c1e;color:#eee;padding:24px;line-height:1.7}
  h1{font-size:18px;margin-bottom:16px}
  .r{padding:4px 0;border-bottom:1px solid #333}
  .ok::before{content:"PASS ";color:#6bd07a;font-weight:bold}
  .ng::before{content:"FAIL ";color:#ff6b6b;font-weight:bold}
  .ng{color:#ffb0b0}
  .why{color:#ff8f8f;padding-left:3em;font-size:13px}
  #sum{margin-top:18px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<h1>折りたたまれた世界 — 検証</h1>
<div id="out"></div>
<div id="sum"></div>
<script>
"use strict";
"use strict";
// ===== 調整用の数値（ここだけ触れば遊び心地が変わる） =====
// 長さの単位は「マス目 1 つ = 1」。x は右、y は上。マス (cx,cy) は [cx,cx+1]×[cy,cy+1]。
const CFG = {
  hero: {
    hw: 0.32,        // 体の半分の幅
    h: 1.5,          // 体の高さ（足元が y）
    speed: 6.4,      // 走る速さ（マス/秒）
    accelG: 70,      // 地上の加速
    accelA: 42,      // 空中の加速（空中制御）
    frictionG: 80,   // 地上で止まる強さ
    gravity: 38,
    jumpV: 14.2,     // ジャンプの初速。最高到達 = jumpV^2/(2g) ≒ 2.65 マス
    cutV: 0.45,      // ジャンプボタンを離したときの上昇の減衰
    maxFall: 26,
    coyote: 0.09,    // 足場を離れても跳べる猶予
    buffer: 0.12,    // 着地前の先行入力
    deathY: -6,      // これより下に落ちたらやり直し
  },
  fold: {
    near: 9.5,       // 折り目からこの距離（マス）以内で「折る」が効く
    dur: 0.62,       // 折るアニメーションの長さ（この間は主人公も止まる）
    shakeDur: 0.4,   // 折れないときの震え
    lift: 3,         // 折り先に体が重なったとき、上へ持ち上げられる最大の高さ
    push: 0,         // 横への押し出しは使わない（壁越しにワープしてしまうため）
  },
  item: {
    shardR: 1.0,     // 小さな欠片を取れる距離（体の中心から）
    flagR: 1.1,      // 旗に触れる距離
    spikeH: 0.55,    // トゲの高さ（マスの下から）
  },
  solver: { stepUp: 2, maxGap: 4 },   // 検証用の「届く」判定（実物のジャンプ 約4.8マス・2.65マスより控えめ）
  cam: { fov: 36, dist: 21, smooth: 6, minY: 5.2 },
};

// ===== ステージの部品 =====
// 地面は行 0〜1（上面 y=2）。L.cur が「いま置いている x」。部品を順に並べるとステージになる。
// folds: 折り目。縦の折り目 {f, w, dir, y0, y1}（折り目 f の縦線で、幅 w・高さ y0〜y1 の耳を右(dir=+1)か左に持つ。耳は x → 2f-1-x へ）
//        横の折り目 {axis:'y', f, h, dir, x0, x1}（折り目の高さ f の線で、x0〜x1 の耳を上(dir=+1)に高さ h。行 y → 2f-1-y へ）
//        back: 耳の「裏面」にだけある足場（[x, y, 幅, 高さ]、元の位置の座標）。折って裏返ったときだけ現れる。
const LB = {
  make(id, name, hint, world, theme, opts = {}) {
    return Object.assign({ id, name, hint, world, theme, w: 0, h: 14, cur: 0, start: { x: 2.5, y: 2 }, rects: [], folds: [], spikes: [], flags: [], shards: [] }, opts);
  },
  run(L, n) { L.rects.push([L.cur, 0, n, 2]); L.cur += n; },
  pit(L, n) { L.cur += n; },
  flag(L) { L.flags.push({ x: L.cur - 1.5, y: 2 }); },
  shard(L, x, y, back) { L.shards.push(back === undefined ? { x, y } : { x, y, back }); },
  // 小さな足場を、間をあけて並べる（間は落ちる）。ジャンプの正確さ
  hop(L, n, gap, w = 2) {
    for (let i = 0; i < n; i++) { L.rects.push([L.cur, 0, w, 2]); L.cur += w; if (i < n - 1) L.cur += gap; }
  },
  // 低い壁。足元の 1 段を折って、小さな段を作る
  wallStep(L) {
    const x = L.cur; LB.run(L, 2);
    L.rects.push([x, 2, 2, 3]); L.folds.push({ f: x, w: 2, dir: 1, y0: 2, y1: 3 });
    LB.run(L, 6);   // 次の障害物までの距離（段の上から跳び移れないように）
  },
  // 高い崖（上面 6）。足元の 2 段を折って階段にする
  cliffStep(L) {
    const x = L.cur; LB.run(L, 4);
    L.rects.push([x, 2, 4, 4]); L.folds.push({ f: x, w: 2, dir: 1, y0: 2, y1: 4 });
    LB.run(L, 6);
  },
  // 穴（幅 g）。向こう岸の地面の表面を板にして、穴にかぶせる
  plank(L, g, after) {
    LB.pit(L, g); const x = L.cur; LB.run(L, after);
    L.folds.push({ f: x, w: g, dir: 1, y0: 1, y1: 2 });
  },
  // 穴（幅 g）。裏面にだけある板（折るまで見えない。上面が 3 になる）
  plankBackHigh(L, g, after) {
    LB.pit(L, g); const x = L.cur; LB.run(L, after);
    L.folds.push({ f: x, w: g, dir: 1, y0: 2, y1: 3, back: [[x, 2, g, 1]] });
  },
  // 広い穴（幅 g）。手前の半分は裏の板、向こうの半分は表の板（二重折り）
  doubleBridge(L, g, after) {
    const h = g / 2;
    LB.pit(L, g); const x = L.cur; LB.run(L, after);
    L.folds.push({ f: x - h, w: h, dir: 1, y0: 1, y1: 2, back: [[x - h, 1, h, 1]] });   // 裏の板（穴の中ほどが折り目）
    L.folds.push({ f: x, w: h, dir: 1, y0: 1, y1: 2 });
  },
  // トゲ（幅 n）と、その右の出っ張り。折ってトゲにかぶせる
  plate(L, n) {
    const x = L.cur; LB.run(L, 2 * n);
    L.spikes.push([x, 2, n]); L.rects.push([x + n, 2, n, 1]); L.folds.push({ f: x + n, w: n, dir: 1, y0: 2, y1: 3 });
    LB.run(L, 6);
  },
  // 高い崖（上面 top）。横の折り目で上を折り下ろすと、上面が 4 になる
  cliffY(L, w, top) {
    const x = L.cur; LB.run(L, w);
    L.rects.push([x, 2, w, top - 2]); L.folds.push({ axis: 'y', f: 4, h: top - 4, dir: 1, x0: x, x1: x + w });
    LB.run(L, 6);
  },
  // 空中の足場（2マス幅×n 段）を折り下ろして階段にし、高い床（幅 gW、行 gRow）へ
  stairsY(L, n, gW, gRow) {
    const x = L.cur; LB.run(L, 2 * n); LB.pit(L, gW);   // 床の下は穴（階段を使わないと通れない）
    for (let i = 0; i < n; i++) L.rects.push([x + 2 * i, 12 - 2 * i, 2, 1]);
    L.folds.push({ axis: 'y', f: 8, h: 5, dir: 1, x0: x, x1: x + 2 * n });
    L.rects.push([x + 2 * n, gRow, gW, 1]);
  },
  // 階段（3 段）の先の床に、塔。塔の上を折り下ろして低くし、先の床（上面 10）へ
  stairsTower(L) {
    const x = L.cur; LB.run(L, 6); LB.pit(L, 11 + 10);
    for (let i = 0; i < 3; i++) L.rects.push([x + 2 * i, 12 - 2 * i, 2, 1]);
    L.folds.push({ axis: 'y', f: 8, h: 5, dir: 1, x0: x, x1: x + 6 });
    L.rects.push([x + 6, 7, 11, 1]);
    L.rects.push([x + 15, 8, 2, 5]);
    L.folds.push({ axis: 'y', f: 10, h: 3, dir: 1, x0: x + 15, x1: x + 17 });
    L.rects.push([x + 17, 9, 10, 1]);
    L.towerX = x;
  },
  // 裏面の階段（縦の折り目）と、高い床
  backStairsX(L, gW) {
    const x = L.cur; LB.run(L, gW);
    L.folds.push({ f: x, w: 4, dir: 1, y0: 3, y1: 7, back: [[x + 2, 3, 2, 1], [x, 5, 2, 1]] });
    L.rects.push([x, 7, gW, 1]);
  },
  // 穴（幅 8）の上に、裏面のアーチ
  backArch(L, after) {
    LB.pit(L, 8); const x = L.cur; LB.run(L, after);
    L.folds.push({ f: x, w: 8, dir: 1, y0: 3, y1: 6, back: [[x + 6, 3, 2, 1], [x + 4, 5, 2, 1], [x + 2, 5, 2, 1], [x, 3, 2, 1]] });
  },
  // 穴（幅 7）と、向こうの崖。板と階段を同時に折る（二重折り）
  bridgeStairs(L, after) {
    LB.pit(L, 7); const x = L.cur; LB.run(L, after);
    L.rects.push([x + 2, 2, 5, 4]);
    L.folds.push({ f: x, w: 7, dir: 1, y0: 1, y1: 2 });
    L.rects.push([x - 2, 12, 2, 1], [x, 10, 2, 1]);
    L.folds.push({ axis: 'y', f: 8, h: 5, dir: 1, x0: x - 2, x1: x + 2 });
  },
  // 乗って折る：穴（幅 2w）の手前の半分に、地面から張り出した板。板の上に乗って折ると、板ごとひっくり返って
  // 向こうの半分にかかり、主人公は向こう側の端へ運ばれる
  ride(L, w, after) {
    const x0 = L.cur;
    L.rects.push([x0, 1, w, 1]);
    L.folds.push({ f: x0 + w, w, dir: -1, y0: 1, y1: 2, ride: true });
    L.cur = x0 + 2 * w; LB.run(L, after);
  },
  // 乗って折ったあとも、板の上に乗ったまま次の板を折る（二重折り）。間は 3 マス跳ぶ
  rideChain(L, after) {
    const x0 = L.cur;
    L.rects.push([x0, 1, 5, 1]);
    L.folds.push({ f: x0 + 5, w: 5, dir: -1, y0: 1, y1: 2, ride: true });
    L.cur = x0 + 18; LB.run(L, after);
    L.folds.push({ f: x0 + 18, w: 5, dir: 1, y0: 1, y1: 2 });
  },
  // 乗って折った板の上で、そのまま階段を折って崖を登る（二重折り）
  rideStairs(L, after) {
    const x0 = L.cur;
    L.rects.push([x0, 1, 6, 1]);
    L.folds.push({ f: x0 + 6, w: 6, dir: -1, y0: 1, y1: 2, ride: true });
    L.cur = x0 + 14; LB.run(L, after);
    L.rects.push([x0 + 14, 2, 5, 4]);
    L.rects.push([x0 + 10, 12, 2, 1], [x0 + 12, 10, 2, 1]);
    L.folds.push({ axis: 'y', f: 8, h: 5, dir: 1, x0: x0 + 10, x1: x0 + 14 });
  },
  goal(L, y = 2) { L.goal = { x: L.cur - 2.5, y }; L.w = L.cur; },
};

// ===== ステージ =====
const LEVELS = [];
(function () {
  let L, a, b;
  const done = lv => { LB.goal(lv); LEVELS.push(lv); };

  // 1-1 はじめの紙：縦の折り目の基本。壁の足元、板、トゲの板、崖
  L = LB.make('1-1', 'はじめの紙', '折ると、遠くの紙が手前に来る', 1, 'meadow');
  LB.run(L, 7);
  LB.wallStep(L); LB.run(L, 5);
  a = L.cur; LB.hop(L, 3, 3); LB.shard(L, a + 4, 4);
  LB.run(L, 4); LB.flag(L);
  a = L.cur; LB.plank(L, 8, 10); LB.shard(L, a + 4, 4);
  LB.run(L, 2); LB.flag(L);
  LB.plate(L, 6); LB.run(L, 4); LB.flag(L);
  a = L.cur; LB.cliffStep(L); LB.shard(L, a + 2, 8); LB.run(L, 3);
  LB.hop(L, 3, 3); LB.run(L, 3); LB.flag(L);
  LB.plank(L, 7, 9); LB.run(L, 6);
  done(L);

  // 1-2 紙のうら：裏面にだけある足場。そして「乗って折る」
  L = LB.make('1-2', '紙のうら', '折ると、裏にだけある足場が現れる', 1, 'meadow');
  LB.run(L, 7);
  a = L.cur; LB.plankBackHigh(L, 8, 10); LB.shard(L, a + 4, 3, 0);
  LB.run(L, 2); LB.flag(L);
  LB.plate(L, 7); LB.run(L, 3); LB.shard(L, L.cur - 10, 5);
  LB.hop(L, 4, 3); LB.run(L, 3); LB.flag(L);
  a = L.cur; LB.ride(L, 6, 10); LB.shard(L, a + 6, 4); LB.run(L, 3); LB.flag(L);
  LB.plate(L, 6); LB.run(L, 4); LB.flag(L);
  a = L.cur; LB.backStairsX(L, 10);
  LB.run(L, 4);
  L.goal = { x: a + 8.5, y: 8 }; L.w = L.cur;
  LEVELS.push(L);

  // 1-3 折り重ねる：裏面のアーチと総まとめ。最後は「乗って折って」ゴールへ（ワールド1の最後：大きな欠片＝横の折り目）
  L = LB.make('1-3', '折り重ねる', '橋・板・階段を、順番に折っていく', 1, 'meadow', { big: 'yfold' });
  LB.run(L, 7);
  a = L.cur; LB.backArch(L, 10); LB.shard(L, a + 3, 7);
  LB.run(L, 2); LB.flag(L);
  LB.plate(L, 7); LB.run(L, 3);
  LB.wallStep(L); LB.run(L, 4);
  a = L.cur; LB.hop(L, 4, 3); LB.shard(L, a + 7, 4);
  LB.run(L, 3); LB.flag(L);
  LB.plank(L, 8, 10); LB.run(L, 2);
  LB.cliffStep(L); LB.run(L, 3); LB.flag(L);
  LB.plate(L, 8); LB.run(L, 4); LB.flag(L);
  LB.hop(L, 3, 3); LB.shard(L, L.cur - 5, 4); LB.run(L, 4); LB.flag(L);
  LB.ride(L, 7, 8);
  done(L);

  // 2-1 たかさを折る：横の折り目
  L = LB.make('2-1', 'たかさを折る', '横の折り目で、崖を低くする・高い足場を下ろす', 2, 'sunset');
  LB.run(L, 7);
  a = L.cur; LB.cliffY(L, 4, 6); LB.shard(L, a + 1, 6);
  LB.run(L, 4); LB.flag(L);
  LB.hop(L, 4, 3); LB.run(L, 3);
  LB.cliffY(L, 3, 8); LB.run(L, 4); LB.flag(L);
  LB.plate(L, 6); LB.run(L, 3); LB.flag(L);
  a = L.cur; LB.plank(L, 8, 10); LB.shard(L, a + 4, 4); LB.run(L, 3); LB.flag(L);
  a = L.cur; LB.stairsY(L, 2, 12, 7); LB.shard(L, a + 8, 10);
  L.goal = { x: a + 14.5, y: 8 }; L.w = L.cur;
  LEVELS.push(L);

  // 2-2 がけと穴：縦と横の折りを、順番に。乗って折る板も
  L = LB.make('2-2', 'がけと穴', '縦と横の折りを、順番に', 2, 'sunset');
  LB.run(L, 6);
  LB.plank(L, 8, 10); LB.run(L, 2);
  LB.cliffY(L, 3, 9); LB.run(L, 3); LB.flag(L);
  LB.plate(L, 7); LB.run(L, 3);
  LB.hop(L, 4, 3); LB.shard(L, L.cur - 5, 4); LB.run(L, 3); LB.flag(L);
  LB.cliffStep(L); LB.run(L, 3);
  LB.cliffY(L, 4, 7); LB.run(L, 3); LB.flag(L);
  a = L.cur; LB.ride(L, 6, 10); LB.shard(L, a + 6, 4); LB.run(L, 3); LB.flag(L);
  a = L.cur; LB.plankBackHigh(L, 8, 10); LB.shard(L, a + 4, 3, 6); LB.run(L, 3); LB.flag(L);
  a = L.cur; LB.stairsY(L, 2, 12, 7); LB.shard(L, a + 8, 10);
  L.goal = { x: a + 14.5, y: 8 }; L.w = L.cur;
  LEVELS.push(L);

  // 2-3 さかさの塔（ワールド2の最後：大きな欠片＝二重折り）。乗って折ってゴールへ
  L = LB.make('2-3', 'さかさの塔', '板と階段で空へ。最後の塔を低くする', 2, 'sunset', { big: 'double' });
  LB.run(L, 6);
  a = L.cur; LB.plank(L, 8, 10); LB.shard(L, a + 4, 4); LB.run(L, 2); LB.flag(L);
  LB.plate(L, 8); LB.run(L, 3);
  LB.cliffY(L, 4, 7); LB.run(L, 3); LB.flag(L);
  LB.hop(L, 4, 3); LB.run(L, 3);
  LB.stairsY(L, 2, 12, 7); LB.run(L, 3); LB.flag(L);
  LB.plank(L, 7, 9); LB.run(L, 4); LB.flag(L);
  LB.stairsTower(L);
  L.spikes.push([L.towerX + 9, 8, 2]);
  L.flags.push({ x: L.towerX + 7.5, y: 8 }, { x: L.towerX + 19.5, y: 10 });
  LB.shard(L, L.towerX + 3, 8); LB.shard(L, L.towerX + 22, 12);
  LB.run(L, 4); LB.flag(L);
  LB.ride(L, 7, 8);
  done(L);

  // 3-1 ふたつ同時：二重折り。乗ったまま次を折る
  L = LB.make('3-1', 'ふたつ同時', '2か所を同時に折る。乗ったまま、次を折る', 3, 'night', { maxFolds: 2 });
  LB.run(L, 7);
  a = L.cur; LB.doubleBridge(L, 12, 14); LB.shard(L, a + 3, 4); LB.shard(L, a + 9, 4);
  LB.run(L, 2); LB.flag(L);
  LB.plate(L, 7); LB.run(L, 3);
  LB.hop(L, 4, 3); LB.run(L, 3); LB.flag(L);
  a = L.cur; LB.rideChain(L, 10); LB.shard(L, a + 10, 4); LB.run(L, 3); LB.flag(L);
  LB.plate(L, 6); LB.run(L, 4);
  LB.shard(L, L.cur - 6, 4);
  done(L);

  // 3-2 橋と階段：板の上で階段を折る。乗って折った板の上で階段を折る
  L = LB.make('3-2', '橋と階段', '板や階段を、乗ったまま折る', 3, 'night', { maxFolds: 2 });
  LB.run(L, 7);
  a = L.cur; LB.bridgeStairs(L, 14); LB.shard(L, a + 1, 4); LB.shard(L, a + 6, 7);
  LB.run(L, 2); LB.flag(L);
  LB.plate(L, 7); LB.run(L, 3);
  LB.hop(L, 3, 3); LB.shard(L, L.cur - 5, 4); LB.run(L, 3); LB.flag(L);
  LB.rideStairs(L, 12); LB.run(L, 4); LB.flag(L);
  LB.plankBackHigh(L, 8, 10); LB.run(L, 3);
  LB.cliffY(L, 4, 7); LB.run(L, 5);
  done(L);

  // 3-3 みっつの橋（ワールド3の最後：大きな欠片）
  L = LB.make('3-3', 'みっつの橋', '二重の橋、トゲの板、橋と階段', 3, 'night', { maxFolds: 2, big: 'final' });
  LB.run(L, 6);
  a = L.cur; LB.doubleBridge(L, 12, 14); LB.shard(L, a + 6, 4);
  LB.run(L, 2); LB.flag(L);
  LB.plate(L, 8); LB.run(L, 3); LB.flag(L);
  LB.rideChain(L, 10); LB.run(L, 3);
  LB.hop(L, 4, 3); LB.run(L, 3); LB.flag(L);
  LB.cliffStep(L); LB.run(L, 3);
  LB.plate(L, 7); LB.run(L, 4); LB.flag(L);
  LB.bridgeStairs(L, 14); LB.run(L, 3); LB.flag(L);
  a = L.cur; LB.rideStairs(L, 12); LB.shard(L, a + 11, 7); LB.run(L, 4);
  LB.hop(L, 4, 3); LB.shard(L, L.cur - 5, 4); LB.run(L, 4); LB.flag(L);
  LB.ride(L, 7, 8);
  done(L);

  // 4 おりたたまれた世界（最終ステージ）
  L = LB.make('4', 'おりたたまれた世界', 'これまでの折りを、すべて使って', 4, 'night', { maxFolds: 2, final: true });
  LB.run(L, 6);
  a = L.cur; LB.doubleBridge(L, 12, 14); LB.shard(L, a + 6, 4);
  LB.run(L, 2); LB.flag(L);
  LB.cliffY(L, 4, 8); LB.run(L, 3);
  LB.plate(L, 8); LB.run(L, 3); LB.flag(L);
  LB.hop(L, 5, 3); LB.run(L, 3);
  LB.rideChain(L, 10); LB.run(L, 3); LB.flag(L);
  LB.cliffStep(L); LB.run(L, 3);
  LB.bridgeStairs(L, 14); LB.run(L, 3); LB.flag(L);
  LB.plankBackHigh(L, 8, 10); LB.run(L, 3);
  LB.backArch(L, 10); LB.run(L, 3); LB.flag(L);

  LB.run(L, 6);

// ===== 盤面・折りのルール・主人公の物理・到達検証（three.js を使わない部分） =====
const HERO = CFG.hero;
const popcount = m => { let c = 0; while (m) { c += m & 1; m >>= 1; } return c; };

class World {
  constructor(level) {
    this.W = level.w; this.H = level.h;
    this.maxFolds = level.maxFolds || 1;   // 同時に折れる数（二重折りは 2）
    this.base = new Uint8Array(this.W * this.H);
    for (const [x, y, w, h] of level.rects)
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.base[j * this.W + i] = 1;
    this.folds = level.folds.map(f => {
      const back = new Set();   // 裏面にだけある足場（元の位置の座標）
      for (const [x, y, w, h] of (f.back || []))
        for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) back.add(j * this.W + i);
      if (f.axis === 'y') {     // 横の折り目（上下に折る）：耳は x0〜x1、折り目の高さ f から上(dir=+1)か下(-1)へ h
        const y0 = f.dir > 0 ? f.f : f.f - f.h;
        return { axis: 'y', f: f.f, dir: f.dir, x0: f.x0, x1: f.x1, y0, y1: y0 + f.h, back };
      }
      const x0 = f.dir > 0 ? f.f : f.f - f.w;   // 縦の折り目（左右に折る）
      return { axis: 'x', f: f.f, dir: f.dir, x0, x1: x0 + f.w, y0: f.y0, y1: f.y1, back, ride: !!f.ride };
    });
    this.spikes = [];
    for (const [x, y, w] of (level.spikes || [])) for (let i = 0; i < w; i++) this.spikes.push({ cx: x + i, cy: y, back: -1 });
    this.shards = (level.shards || []).map(s => ({ cx: s.x, cy: s.y, back: s.back === undefined ? -1 : s.back }));
    this.flags = (level.flags || []).map(f => ({ cx: Math.floor(f.x), cy: f.y, x: f.x, y: f.y }));
    this.mask = 0;      // 折っている折り目（ビット i = i 番）
  }
  isOn(i, mask = this.mask) { return (mask >> i & 1) === 1; }
  // 鏡写しの位置
  mir(fd, cx, cy) { return fd.axis === 'x' ? [2 * fd.f - 1 - cx, cy] : [cx, 2 * fd.f - 1 - cy]; }
  inSource(fd, cx, cy) { return cx >= fd.x0 && cx < fd.x1 && cy >= fd.y0 && cy < fd.y1; }
  inTarget(fd, cx, cy) { const m = this.mir(fd, cx, cy); return this.inSource(fd, m[0], m[1]); }
  baseSolid(cx, cy) { return cx >= 0 && cx < this.W && cy >= 0 && cy < this.H && this.base[cy * this.W + cx] === 1; }
  // 耳の元の位置にある固いマス（表の紙＋裏面の足場）
  srcSolid(fd, cx, cy) {
    return this.baseSolid(cx, cy) || (cx >= 0 && cx < this.W && cy >= 0 && cy < this.H && fd.back.has(cy * this.W + cx));
  }
  // 折り状態（mask）を考慮した「そこは固い？」。紙の左右の端は見えない壁、下は落ちる
  solid(cx, cy, mask = this.mask) {
    if (cx < 0 || cx >= this.W) return true;
    if (cy < 0 || cy >= this.H) return false;
    let s = this.base[cy * this.W + cx] === 1;
    if (mask) {
      for (let i = 0; i < this.folds.length; i++) {
        if (!(mask >> i & 1)) continue;
        const fd = this.folds[i];
        if (s && this.inSource(fd, cx, cy)) s = false;
      }
      if (!s) for (let i = 0; i < this.folds.length; i++) {
        if (!(mask >> i & 1)) continue;
        const fd = this.folds[i];
        if (this.inTarget(fd, cx, cy)) { const m = this.mir(fd, cx, cy); if (this.srcSolid(fd, m[0], m[1])) { s = true; break; } }
      }
    }
    return s;
  }
  // 折り目 i が折り返したマスか
  isLayerOf(i, cx, cy) {
    const fd = this.folds[i];
    if (!this.inTarget(fd, cx, cy)) return false;
    const m = this.mir(fd, cx, cy);
    return this.srcSolid(fd, m[0], m[1]);
  }
  // 元の位置に残っている紙のマス
  isKept(cx, cy, mask = this.mask) {
    if (!this.baseSolid(cx, cy)) return false;
    for (let i = 0; i < this.folds.length; i++) if ((mask >> i & 1) && this.inSource(this.folds[i], cx, cy)) return false;
    return true;
  }
  // アイテム（トゲ・欠片）が今いるマス。裏面にだけあるものは、その折り目を折っているときだけ現れる
  itemCell(it, mask = this.mask) {
    if (it.back >= 0) {
      if (!(mask >> it.back & 1)) return null;
      return this.mir(this.folds[it.back], it.cx, it.cy);
    }
    for (let i = 0; i < this.folds.length; i++)
      if ((mask >> i & 1) && this.inSource(this.folds[i], it.cx, it.cy)) return this.mir(this.folds[i], it.cx, it.cy);
    return [it.cx, it.cy];
  }
  // 働いているトゲのマス（板でふさがれたら働かない）
  spikeCell(sp, mask = this.mask) {
    const c = this.itemCell(sp, mask);
    return c && !this.solid(c[0], c[1], mask) ? c : null;
  }
  // 耳の折り先の範囲
  targetRect(fd) {
    return fd.axis === 'x'
      ? { x0: 2 * fd.f - fd.x1, x1: 2 * fd.f - fd.x0, y0: fd.y0, y1: fd.y1 }
      : { x0: fd.x0, x1: fd.x1, y0: 2 * fd.f - fd.y1, y1: 2 * fd.f - fd.y0 };
  }
}

// 主人公の体が重なるマスの範囲 [x0,x1,y0,y1]
function heroCells(x, y) {
  return [Math.floor(x - HERO.hw + 1e-6), Math.floor(x + HERO.hw - 1e-6),
          Math.floor(y + 1e-6), Math.floor(y + HERO.h - 1e-6)];
}

function hitsSpike(w, h) {
  for (const sp of w.spikes) {
    const c = w.spikeCell(sp);
    if (!c) continue;
    if (h.x + HERO.hw > c[0] + 0.1 && h.x - HERO.hw < c[0] + 0.9 && h.y < c[1] + CFG.item.spikeH && h.y + HERO.h > c[1]) return true;
  }
  return false;
}

// 折り目までの距離（ガイドと「いちばん近い折り目」の選択用）
function hingeDist(fd, x, y) {
  if (fd.axis === 'x') return Math.hypot(x - fd.f, Math.max(0, fd.y0 - y, y - fd.y1));
  return Math.hypot(y - fd.f, Math.max(0, fd.x0 - x, x - fd.x1));
}

// 2つの耳を同時に折れる？（耳の元どうしが重ならない／折り先が相手の紙に乗らない）
function compatible(w, i, j) {
  const a = w.folds[i], b = w.folds[j];
  const ov = (p, q) => p.x0 < q.x1 && q.x0 < p.x1 && p.y0 < q.y1 && q.y0 < p.y1;
  if (ov(a, b)) return false;
  const hit = (tgt, src) => {
    for (let cy = Math.max(tgt.y0, src.y0); cy < Math.min(tgt.y1, src.y1); cy++)
      for (let cx = Math.max(tgt.x0, src.x0); cx < Math.min(tgt.x1, src.x1); cx++)
        if (w.baseSolid(cx, cy)) return true;
    return false;
  };
  return !hit(w.targetRect(a), b) && !hit(w.targetRect(b), a);
}

// 体が盤面（折り状態 mask）にめり込んでいないか
function heroFits(w, x, y, mask) {
  const [x0, x1, y0, y1] = heroCells(x, y);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) if (w.solid(cx, cy, mask)) return false;
  return true;
}
function heroSupported(w, x, y, mask) {
  const [x0, x1] = heroCells(x, y);
  const row = Math.floor(y - 0.05);
  for (let cx = x0; cx <= x1; cx++) if (w.solid(cx, row, mask)) return true;
  return false;
}
// 折り先に体が重なるとき：上へ持ち上げて紙の上に乗せる（最大 CFG.fold.lift マス）。だめなら横へ押し出す。
// 返り値 { x, y } または null（どうしても入らない）
function resolveFit(w, x, y, mask) {
  if (heroFits(w, x, y, mask)) return { x, y };
  for (let dy = 1; dy <= CFG.fold.lift; dy++)
    if (heroFits(w, x, y + dy, mask) && heroSupported(w, x, y + dy, mask)) return { x, y: y + dy };
  for (const needSupport of [true, false])
    for (let d = 0.5; d <= CFG.fold.push + 1e-9; d += 0.5)
      for (const s of [1, -1]) {
        const nx = x + s * d;
        if (heroFits(w, nx, y, mask) && (!needSupport || heroSupported(w, nx, y, mask))) return { x: nx, y };
      }
  return null;
}

// 折れる？  { ok, why, x, y, carried }
//   why: far / side / active / max / compat / overlap
//   折り先に体が重なっても、紙の上に持ち上げる（または押し出す）ので折れる。耳の上に乗っていたら、耳ごと運ぶ（縦の折り目）
function canFold(w, i, x, y) {
  const fd = w.folds[i];
  if (w.isOn(i)) return { ok: false, why: 'active' };
  if (popcount(w.mask) >= w.maxFolds) return { ok: false, why: 'max' };
  for (let j = 0; j < w.folds.length; j++) if (w.isOn(j) && !compatible(w, i, j)) return { ok: false, why: 'compat' };
  const [x0, x1] = heroCells(x, y);
  const row = Math.floor(y - 0.05);
  let onTab = false;
  for (let cx = x0; cx <= x1; cx++) if (w.inSource(fd, cx, row) && w.baseSolid(cx, row)) onTab = true;
  if (fd.axis === 'x') {
    // 主人公は耳の反対側にいる。ただし「乗って折る」耳（ride）は、耳の上に乗って折る
    if (!(fd.ride && onTab) && (fd.dir > 0 ? x >= fd.f : x <= fd.f)) return { ok: false, why: 'side' };
    if (Math.abs(x - fd.f) > CFG.fold.near || y < fd.y0 - 5 || y > fd.y1 + 6) return { ok: false, why: 'far' };
  } else {
    if (fd.dir > 0 ? y >= fd.f : y < fd.f) return { ok: false, why: 'side' };
    if (Math.abs(y - fd.f) > CFG.fold.near || x < fd.x0 - 4 || x > fd.x1 + 4) return { ok: false, why: 'far' };
  }
  const carried = onTab && fd.axis === 'x';
  const nx = carried ? 2 * fd.f - x : x;
  const res = resolveFit(w, nx, y, w.mask | (1 << i));
  if (!res) return { ok: false, why: 'overlap' };
  return { ok: true, x: res.x, y: res.y, carried };
}

// 折り目 j を戻せる？  { ok, why, carried, nx, y }
//   耳の上に乗っていたら、耳ごと元の位置へ運ばれる（縦の折り目のみ）。戻した紙が体に重なるときは持ち上げる
function canUnfold(w, j, x, y) {
  if (!w.isOn(j)) return { ok: false, why: 'none' };
  const fd = w.folds[j];
  const [x0, x1] = heroCells(x, y);
  const row = Math.floor(y - 0.05);
  let kept = false, onJ = false, onOther = false;
  for (let cx = x0; cx <= x1; cx++) {
    if (w.isKept(cx, row)) { kept = true; continue; }
    for (let k = 0; k < w.folds.length; k++) {
      if (!w.isOn(k) || !w.isLayerOf(k, cx, row)) continue;
      if (k === j) onJ = true; else onOther = true;
    }
  }
  const carried = onJ && !kept && !onOther && fd.axis === 'x';
  const mask2 = w.mask & ~(1 << j);
  const res = resolveFit(w, carried ? 2 * fd.f - x : x, y, mask2);
  if (!res) return { ok: false, why: 'overlap' };
  // 縦の折りで運ばれた先に足場がなければ（裏面の板の上）、落ちてしまうので戻せない
  if (carried && !heroSupported(w, res.x, res.y, mask2)) return { ok: false, why: 'void' };
  return { ok: true, carried, nx: res.x, y: res.y };
}

// 次に折りたい折り目 j を、前の折りを自動で戻しながら折る計画
//   { ok, unfold: 戻す折り目（なければ -1）, r: canFold の結果 }。order は古い順の折っている番号
function planFold(w, j, x, y, order) {
  const r = canFold(w, j, x, y);
  if (r.ok) return { ok: true, unfold: -1, r };
  if (r.why !== 'max' && r.why !== 'compat') return { ok: false, why: r.why };
  const saved = w.mask;
  for (const i of order) {
    if (!w.isOn(i)) continue;
    const u = canUnfold(w, i, x, y);
    if (!u.ok || u.carried || u.nx !== x || u.y !== y) continue;   // 自動で戻すのは、主人公が動かないときだけ
    w.mask = saved & ~(1 << i);
    const f = canFold(w, j, x, y);
    w.mask = saved;
    if (f.ok) return { ok: true, unfold: i, r: f };
  }
  return { ok: false, why: r.why };
}

// ---- 主人公の物理（足元が y、中心が x） ----
function newHero(level, at) {
  const s = at || level.start;
  return { x: s.x, y: s.y, vx: 0, vy: 0, ground: true, face: 1, coyote: 0, buf: 0, jumping: false, jumped: false, landed: 0 };
}

// inp: { left, right, jumpHeld, jumpPressed }
function stepHero(w, h, inp, dt) {
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const target = dir * HERO.speed;
  const acc = dir !== 0 ? (h.ground ? HERO.accelG : HERO.accelA) : (h.ground ? HERO.frictionG : HERO.accelA * 0.4);
  if (h.vx < target) h.vx = Math.min(target, h.vx + acc * dt);
  else if (h.vx > target) h.vx = Math.max(target, h.vx - acc * dt);
  if (dir) h.face = dir;

  h.coyote = h.ground ? HERO.coyote : Math.max(0, h.coyote - dt);
  h.buf = inp.jumpPressed ? HERO.buffer : Math.max(0, h.buf - dt);
  h.jumped = false; h.landed = 0;
  if (h.buf > 0 && h.coyote > 0) { h.vy = HERO.jumpV; h.buf = 0; h.coyote = 0; h.ground = false; h.jumped = true; h.jumping = true; }
  if (h.jumping && !inp.jumpHeld && h.vy > 0) { h.vy *= HERO.cutV; h.jumping = false; }
  if (h.vy <= 0) h.jumping = false;
  h.vy = Math.max(-HERO.maxFall, h.vy - HERO.gravity * dt);

  // X
  let nx = h.x + h.vx * dt;
  const r = heroCells(h.x, h.y);
  if (h.vx > 0) {
    const cx = Math.floor(nx + HERO.hw);
    for (let cy = r[2]; cy <= r[3]; cy++) if (w.solid(cx, cy)) { nx = cx - HERO.hw - 1e-4; h.vx = 0; break; }
  } else if (h.vx < 0) {
    const cx = Math.floor(nx - HERO.hw);
    for (let cy = r[2]; cy <= r[3]; cy++) if (w.solid(cx, cy)) { nx = cx + 1 + HERO.hw + 1e-4; h.vx = 0; break; }
  }
  h.x = nx;

  // Y
  let ny = h.y + h.vy * dt;
  const bx0 = Math.floor(h.x - HERO.hw + 1e-6), bx1 = Math.floor(h.x + HERO.hw - 1e-6);
  const wasGround = h.ground;
  h.ground = false;
  if (h.vy <= 0) {
    const cy = Math.floor(ny);
    for (let cx = bx0; cx <= bx1; cx++) {
      if (w.solid(cx, cy) && h.y >= cy + 1 - 1e-4) {
        if (!wasGround && h.vy < -8) h.landed = Math.min(1, -h.vy / 20);
        ny = cy + 1; h.vy = 0; h.ground = true; break;
      }
    }
  } else {
    const cy = Math.floor(ny + HERO.h);
    for (let cx = bx0; cx <= bx1; cx++) if (w.solid(cx, cy)) { ny = cy - HERO.h - 1e-4; h.vy = 0; h.jumping = false; break; }
  }
  h.y = ny;
}

// ---- 到達検証：「立てるマス」の間を、歩き・ジャンプ・折る・戻すでつないで、目的に着けるか ----
// 折ったあとの位置 (x, y) から、そのまま立てるか、落ちて着く先を探す（着けなければ null）
function settle(w, x, y, mask) {
  const cx = Math.floor(x);
  if (heroSupported(w, x, y, mask)) return [cx, y];
  for (let yy = Math.floor(y) - 1; yy >= 0; yy--)
    if (w.solid(cx, yy - 1, mask) && !w.solid(cx, yy, mask) && !w.solid(cx, yy + 1, mask)) return [cx, yy];
  return null;
}

function surfaces(w, cx, mask) {
  const out = [];
  if (cx < 0 || cx >= w.W) return out;
  for (let y = 1; y < w.H - 2; y++)
    if (w.solid(cx, y - 1, mask) && !w.solid(cx, y, mask) && !w.solid(cx, y + 1, mask)) out.push(y);
  return out;
}

function spikeAtNode(w, mask, cx, y) {
  for (const sp of w.spikes) { const c = w.spikeCell(sp, mask); if (c && c[0] === cx && c[1] === y) return true; }
  return false;
}

// goalFn(mask, cx, y) が真になる立ち位置まで。返り値 nodes: [{m,cx,y,kind,i}]（kind: start/move/jump/fold/unfold）
function solve(w, level, opts = {}) {
  const allowFold = opts.allowFold !== false;
  const gx = level.goal.x, gy = level.goal.y;
  const goalFn = opts.goalFn || ((m, cx, y) => Math.abs(cx + 0.5 - gx) <= 1.0 && Math.abs(y - gy) <= 1);
  const key = (m, cx, y) => ((m * 200) + cx) * 100 + y;
  const st = opts.start || { cx: Math.floor(level.start.x), y: level.start.y, mask: 0 };   // ヒント用：今の位置から探す
  const sx = st.cx, sy = st.y, sm = st.mask;
  const prev = new Map(), q = [[sm, sx, sy]];
  prev.set(key(sm, sx, sy), { from: null, node: { m: sm, cx: sx, y: sy, kind: 'start' } });
  const save = w.mask;
  let found = null;
  const push = (from, m, cx, y, kind, i) => {
    const k = key(m, cx, y);
    if (prev.has(k)) return;
    if (spikeAtNode(w, m, cx, y)) return;
    prev.set(k, { from, node: { m, cx, y, kind, i } });
    q.push([m, cx, y]);
  };
  while (q.length) {
    const [m, cx, y] = q.shift();
    if (goalFn(m, cx, y)) { found = key(m, cx, y); break; }
    const from = key(m, cx, y);
    const mg = opts.maxGap || CFG.solver.maxGap;
    for (let dx = -mg; dx <= mg; dx++) {
      if (dx === 0) continue;
      const nx = cx + dx, step = Math.sign(dx);
      let blocked = false;
      for (let k = cx + step; k !== nx; k += step)
        if (w.solid(k, y + 2, m) || w.solid(k, y + 3, m)) { blocked = true; break; }
      if (blocked) continue;
      let ys = surfaces(w, nx, m).filter(v => v <= y + CFG.solver.stepUp);
      // 上へ跳ぶときは、出発の列の頭上が空いている（天井にぶつからない）
      ys = ys.filter(v => { for (let r = y + 2; r <= v + 1; r++) if (w.solid(cx, r, m)) return false; return true; });
      if (!ys.length) continue;
      if (Math.abs(dx) === 1) { for (const v of ys) if (v >= y - 7) push(from, m, nx, v, 'move'); }
      else push(from, m, nx, Math.max(...ys), 'jump');
    }
    if (allowFold) {
      const hx = cx + 0.5;
      w.mask = m;
      for (let i = 0; i < w.folds.length; i++) {
        if (m >> i & 1) {
          const r = canUnfold(w, i, hx, y);
          if (r.ok) { const s = settle(w, r.nx, r.y, m & ~(1 << i)); if (s) push(from, m & ~(1 << i), s[0], s[1], 'unfold', i); }
        } else if (hingeDist(w.folds[i], hx, y) <= CFG.fold.near - 0.6 && canFold(w, i, hx, y).ok) {
          { const r = canFold(w, i, hx, y); const s = settle(w, r.x, r.y, m | (1 << i)); if (s) push(from, m | (1 << i), s[0], s[1], 'fold', i); }
        }
      }
    }
  }
  w.mask = save;
  if (found === null) return { solvable: false, nodes: [], steps: [], folds: 0 };
  const nodes = [];
  for (let k = found; k !== null; k = prev.get(k).from) nodes.unshift(prev.get(k).node);
  return { solvable: true, nodes, steps: nodes.slice(1).map(n => n.kind + (n.i !== undefined ? ' ' + n.i : '')), folds: nodes.filter(n => n.kind === 'fold').length };
}

// 小さな欠片 s に、折りを使って届く立ち位置があるか
function shardGoal(w, s) {
  return (m, cx, y) => {
    const c = w.itemCell(s, m);
    if (!c) return false;
    const dy = (c[1] + 0.5) - (y + 0.75);
    return Math.abs(c[0] - cx) <= 1 && dy >= -1 && dy <= 2.2;
  };
}

// ===== 検証 =====
let pass = 0, fail = 0;
function T(name, ok, why) {
  const d = document.createElement('div');
  d.className = 'r ' + (ok ? 'ok' : 'ng');
  d.textContent = name + (ok || !why ? '' : '  — ' + why);
  document.getElementById('out').appendChild(d);
  ok ? pass++ : fail++;
}
const flat = rects => ({ id: 't', w: 40, h: 14, start: { x: 2.5, y: 2 }, goal: { x: 0, y: 0 }, folds: [], rects });
// 部品で小さなステージを作る
function mk(fn, opts) { const L = LB.make('t', 't', '', 1, 'meadow', opts || {}); fn(L); L.w = L.cur; L.goal = { x: L.cur - 2.5, y: 2 }; return L; }

// --- 物理 ---
(function () {
  const w = new World(flat([[0, 0, 40, 2]]));
  const sim = (inp, steps, h) => { for (let i = 0; i < steps; i++) stepHero(w, h, typeof inp === 'function' ? inp(i, h) : inp, 1 / 120); return h; };
  let h = newHero(flat([]), { x: 5, y: 2 }); sim({}, 240, h);
  T('平地に立っていられる', h.ground && Math.abs(h.y - 2) < 1e-6, 'y=' + h.y);
  h = newHero(flat([]), { x: 5, y: 2 }); let maxY = 0;
  sim((i, hh) => { maxY = Math.max(maxY, hh.y); return { jumpPressed: i === 0, jumpHeld: true }; }, 240, h);
  T('フルジャンプの高さ 2.4〜2.9 マス', maxY - 2 > 2.4 && maxY - 2 < 2.9, (maxY - 2).toFixed(2));
  const hk = newHero(flat([]), { x: 5, y: 2 });
  for (let i = 0; i < 200; i++) stepHero(w, hk, { right: true }, 1 / 120);
  const jx = hk.x; let lx = 0;
  for (let i = 0; i < 300; i++) { stepHero(w, hk, { right: true, jumpPressed: i === 0, jumpHeld: true }, 1 / 120); if (i > 5 && hk.ground) { lx = hk.x; break; } }
  T('走りジャンプの距離 4.3 マス以上、5 マス未満（検証の「届く」と食い違わない）', lx - jx > 4.3 && lx - jx < 5.0, (lx - jx).toFixed(2));
  const w3 = new World(flat([[0, 0, 40, 2], [10, 2, 2, 3]]));
  h = newHero(flat([]), { x: 5, y: 2 });
  for (let i = 0; i < 1200; i++) stepHero(w3, h, { right: true, jumpPressed: h.ground && h.x > 8.2, jumpHeld: true }, 1 / 120);
  T('3 マスの壁は跳び越せない', h.x < 10, 'x=' + h.x.toFixed(2));
  const w2 = new World(flat([[0, 0, 40, 2], [10, 2, 2, 2]]));
  h = newHero(flat([]), { x: 5, y: 2 }); let landedOn = false;
  for (let i = 0; i < 600; i++) { stepHero(w2, h, { right: true, jumpPressed: h.ground && h.x > 8.2 && h.x < 9.5, jumpHeld: true }, 1 / 120); if (h.ground && h.x > 10 && h.x < 12 && h.y > 3.99) landedOn = true; }
  T('2 マスの段には跳び乗れる', landedOn);
})();

// --- 折りのルール ---
(function () {
  // 板：x=7 から穴 8 マス（7..14）、向こう岸 15..24
  let L = mk(l => { LB.run(l, 7); LB.plank(l, 8, 10); LB.run(l, 4); });
  let w = new World(L);
  w.mask = 1;
  let ok = true; for (let cx = 7; cx <= 14; cx++) if (!w.solid(cx, 1)) ok = false;
  T('板を折ると穴（7〜14）にかかり、元の位置（15〜22 の行1）は空になる', ok && !w.solid(15, 1) && !w.solid(22, 1) && w.solid(15, 0));
  w.mask = 0;
  T('近づくと折れる／遠いと折れない', canFold(w, 0, 6.5, 2).ok && !canFold(w, 0, 0.5, 2).ok);
  T('耳の反対側（向こう岸）からは折れない', !canFold(w, 0, 17, 2).ok);
  // 板の上で戻すと、板ごと向こう岸へ運ばれる
  w.mask = 1;
  const u = canUnfold(w, 0, 10.5, 2);
  T('板の上で戻すと向こう岸へ運ばれる', u.ok && u.carried && Math.abs(u.nx - 19.5) < 1e-6, JSON.stringify(u));
  const u2 = canUnfold(w, 0, 5, 2);
  T('手前の地面で戻しても動かない', u2.ok && !u2.carried && u2.nx === 5);
  w.mask = 0;

  // 壁の段：折り先に体が重なるときは、持ち上げて紙の上に乗せる
  L = mk(l => { LB.run(l, 8); LB.wallStep(l); LB.run(l, 4); });
  w = new World(L);
  const f = canFold(w, 0, 6.5, 2);   // 段が降りる位置（6〜7, 行2）に立っている
  T('折り先に立っていても折れる（紙の上に持ち上げられる）', f.ok && f.y === 3 && f.x === 6.5, JSON.stringify(f));
  w.mask = 1;
  T('折ると段（6〜7, 行2）ができる', w.solid(6, 2) && w.solid(7, 2) && !w.solid(8, 2) && w.solid(8, 3));

  // 次の折りを折るとき、前の折りが自動で戻る
  L = mk(l => { LB.run(l, 7); LB.plank(l, 8, 10); LB.run(l, 2); LB.plate(l, 6); LB.run(l, 3); });
  w = new World(L);
  w.mask = 1;
  const direct = canFold(w, 1, 24.5, 2);
  T('前の折りが残っていると、そのままでは折れない（max）', !direct.ok && direct.why === 'max');
  const plan = planFold(w, 1, 24.5, 2, [0]);
  T('自動で前の折りを戻して、次を折れる', plan.ok && plan.unfold === 0, JSON.stringify(plan));
  w.mask = 1;
  const plan2 = planFold(w, 1, 10.5, 2, [0]);   // 板の上（戻すと運ばれる）では自動で戻さない
  T('板の上にいて戻すと運ばれてしまうときは、自動切り替えをしない', !plan2.ok, JSON.stringify(plan2));

  // トゲ：かぶせると働かない
  L = mk(l => { LB.run(l, 7); LB.plate(l, 6); LB.run(l, 3); });
  w = new World(L);
  const sp = w.spikes[0];
  T('トゲは折っていないとき働く', w.spikeCell(sp, 0) !== null);
  T('板をかぶせるとトゲは働かない', w.spikeCell(sp, 1) === null);
  T('トゲの上に立つと当たる', (() => { w.mask = 0; return hitsSpike(w, newHero(L, { x: 8.5, y: 2 })); })());
  T('板の上に立ってもトゲに当たらない', (() => { w.mask = 1; return !hitsSpike(w, newHero(L, { x: 8.5, y: 3 })); })());
})();

// --- 裏面・横の折り目・二重折り ---
(function () {
  let L = mk(l => { LB.run(l, 7); LB.plankBackHigh(l, 8, 10); LB.run(l, 4); });
  let w = new World(L);
  T('裏面の板は折る前は存在しない', !w.solid(7, 2) && !w.solid(15, 2));
  w.mask = 1;
  let ok = true; for (let cx = 7; cx <= 14; cx++) if (!w.solid(cx, 2)) ok = false;
  T('折ると裏面の板（上面 3）が穴にかかる', ok);
  T('裏面の板の上で戻そうとすると「足場がない」で戻せない', (() => { const u = canUnfold(w, 0, 10.5, 3); return !u.ok && u.why === 'void'; })());

  L = mk(l => { LB.run(l, 7); LB.cliffY(l, 4, 6); LB.run(l, 4); });
  w = new World(L);
  T('崖の高さが 6 のとき、折らないと越えられない', !solve(w, L, { allowFold: false }).solvable);
  w.mask = 1;
  T('横に折ると崖の上（行4〜5）が下へ折り返り、上面が 4 になる', !w.solid(8, 4) && !w.solid(8, 5) && w.solid(8, 3) && w.solid(8, 2));
  w.mask = 0;
  T('横の折りは、耳の下から折る（上にいると折れない）', canFold(w, 0, 5, 2).ok && !canFold(w, 0, 8, 6).ok);

  L = mk(l => { LB.run(l, 7); LB.stairsY(l, 2, 8, 7); }, {});
  w = new World(L);
  w.mask = 1;
  T('階段が下りてくる（行3 と 行5）', w.solid(7, 3) && w.solid(9, 5) && !w.solid(7, 12) && !w.solid(9, 10));
  const hh = canUnfold(w, 0, 7.5, 4);
  T('階段の上で戻すと、階段が上がって落ちる（戻せる）', hh.ok && !hh.carried, JSON.stringify(hh));

  // 二重折り
  L = mk(l => { LB.run(l, 7); LB.doubleBridge(l, 12, 14); LB.run(l, 4); }, { maxFolds: 2 });
  w = new World(L);
  w.mask = 1;
  T('裏の板を折ってから、表の板も折れる', canFold(w, 1, 12.5, 2).ok);
  w.mask = 3;
  ok = true; for (let cx = 7; cx <= 18; cx++) if (!w.solid(cx, 1)) ok = false;
  T('2 枚とも折ると穴（7〜18）が全部ふさがる', ok);
  const w1 = new World(Object.assign({}, L, { maxFolds: 1 }));
  w1.mask = 1;
  T('1 か所しか折れない面では、2 つ目は折れない', canFold(w1, 1, 12.5, 2).why === 'max');
  // 乗って折る
  L = mk(l => { LB.run(l, 7); LB.ride(l, 6, 8); }, {});
  w = new World(L);
  const rd = canFold(w, 0, 7.5, 2);
  T('板の上に乗って折ると、向こう側の端（x=18.5）へ運ばれる', rd.ok && rd.carried && Math.abs(rd.x - 18.5) < 1e-6, JSON.stringify(rd));
  T('板に乗らずに手前の地面からは折れない', !canFold(w, 0, 5, 2).ok);
  T('向こう側（ゴール側）へ着いたら、乗った板は元に戻せる', (() => { w.mask = 1; const u = canUnfold(w, 0, 18.5, 2); return u.ok && u.carried; })());
  w.mask = 0;
  // 乗って折った板の上では、前の折りを自動で戻せない（二重折りが必要）
  L = mk(l => { LB.run(l, 7); LB.rideChain(l, 10); }, { maxFolds: 1 });
  w = new World(L);
  w.mask = 1;
  const pl = planFold(w, 1, 16.5, 2, [0]);
  T('1 か所しか折れない面では、乗って折った板の上から次の板を折れない', !pl.ok, JSON.stringify(pl));
  T('全 11 ステージ（3×3 + 最終 + ひみつ）', LEVELS.length === 11, 'n=' + LEVELS.length);
  T('大きな欠片は 1-3, 2-3, 3-3 のゴールにある', LEVELS.filter(l => l.big).map(l => l.id).join() === '1-3,2-3,3-3');
})();

// --- 全ステージの到達検証 ---
for (const lv of LEVELS) {
  const w = new World(lv);
  const a = solve(w, lv), b = solve(w, lv, { allowFold: false, maxGap: 5 });
  T(lv.id + ' 折らないとゴールに着けない（幅 ' + lv.w + '）', !b.solvable);
  T(lv.id + ' 折ればゴールに着ける', a.solvable, '');
  if (a.solvable) T(lv.id + ' 解答の折り: ' + a.folds + ' 回', a.folds >= 3);
  lv.shards.forEach((s, i) => {
    const r = solve(w, lv, { goalFn: shardGoal(w, w.shards[i]) });
    T(lv.id + ' 欠片 ' + (i + 1) + ' に届く' + (s.back !== undefined ? '（裏面）' : ''), r.solvable);
  });
  lv.flags.forEach((f, i) => {
    const r = solve(w, lv, { goalFn: (aa, cx, y) => Math.abs(cx + 0.5 - f.x) <= 1 && y === f.y });
    T(lv.id + ' 旗 ' + (i + 1) + ' に届く', r.solvable);
  });
  // どの折り目も、使わないと通れない（折らずに抜けられる所がない）
  let allNeeded = true; const which = [];
  lv.folds.forEach((_, k) => {
    const lv2 = Object.assign({}, lv, { folds: lv.folds.filter((__, i) => i !== k), shards: [] });
    if (solve(new World(lv2), lv2, { maxGap: 5 }).solvable) { allNeeded = false; which.push(k); }
  });
  T(lv.id + ' どの折り目も必要（使わずに通れる所がない）', allNeeded, '不要な折り目: ' + which.join(','));
  if (lv.maxFolds === 2) {
    const w1 = new World(Object.assign({}, lv, { maxFolds: 1 }));
    T(lv.id + ' 二重折りが必要（1 か所だけでは着けない）', !solve(w1, lv).solvable);
  }
}

// --- 実際の物理で通しで遊ぶボット（解答の経路をたどる） ---
function runBot(lv) {
  const w = new World(lv);
  const r = solve(w, lv);
  if (!r.solvable) return { ok: false, why: 'unsolvable' };
  const h = newHero(lv), dt = 1 / 120;
  const log = [];
  let ni = 1, nodeT = 0, t = 0;
  while (ni < r.nodes.length && t < 300) {
    const nd = r.nodes[ni];
    if (nd.kind === 'fold' || nd.kind === 'unfold') {
      const ccx = r.nodes[ni - 1].cx + 0.5;   // 立っているマスの中央に寄ってから折る
      if (!h.ground || Math.abs(h.x - ccx) > 0.15) {
        const dd = ccx - h.x;
        stepHero(w, h, h.ground ? { left: dd < 0, right: dd > 0 } : {}, dt); t += dt; nodeT += dt;
        if (nodeT > 6) return { ok: false, why: 'not ready for ' + nd.kind + ' x=' + h.x.toFixed(2), log };
        continue;
      }
      if (nd.kind === 'fold') {
        const c = canFold(w, nd.i, h.x, h.y);
        if (!c.ok) return { ok: false, why: 'cannot fold ' + nd.i + ' (' + c.why + ') x=' + h.x.toFixed(2), log };
        w.mask |= 1 << nd.i; h.x = c.x; h.y = c.y; log.push('fold' + nd.i + '@' + h.x.toFixed(1));
      } else {
        const c = canUnfold(w, nd.i, h.x, h.y);
        if (!c.ok) return { ok: false, why: 'cannot unfold (' + c.why + ') x=' + h.x.toFixed(2), log };
        w.mask &= ~(1 << nd.i); h.x = c.nx; h.y = c.y; log.push('unfold@' + h.x.toFixed(1));
      }
      h.vx = 0; h.vy = 0; ni++; nodeT = 0; continue;
    }
    // 歩き・ジャンプ
    const tx = nd.cx + 0.5;
    if (h.ground && Math.floor(h.x) === nd.cx && Math.abs(h.y - nd.y) < 0.05 && w.mask === nd.m) { ni++; nodeT = 0; continue; }
    const dx = tx - h.x, dir = Math.abs(dx) < 0.12 ? 0 : Math.sign(dx);
    let jump = false;
    if (h.ground && dir !== 0) {
      const ahead = Math.floor(h.x + dir * 0.7), fr = Math.floor(h.y), sup = Math.floor(h.y - 0.05);
      if (w.solid(ahead, fr) || w.solid(ahead, fr + 1)) jump = true;                       // 壁
      if (!w.solid(ahead, sup) && !w.solid(ahead, sup - 1)) jump = true;                   // 穴
      for (const sp of w.spikes) { const c = w.spikeCell(sp); if (c && c[1] === fr && (c[0] === ahead || c[0] === ahead + dir)) jump = true; }   // トゲ
    }
    stepHero(w, h, { left: dir < 0, right: dir > 0, jumpPressed: jump, jumpHeld: jump || !h.ground }, dt);
    t += dt; nodeT += dt;
    if (h.y < CFG.hero.deathY) return { ok: false, why: 'fell at x=' + h.x.toFixed(1) + ' node ' + ni + ' ' + JSON.stringify(nd), log };
    if (hitsSpike(w, h)) return { ok: false, why: 'spike at x=' + h.x.toFixed(1) + ' node ' + ni, log };
    if (nodeT > 8) return { ok: false, why: 'stuck at x=' + h.x.toFixed(1) + ' y=' + h.y.toFixed(1) + ' node ' + ni + ' ' + JSON.stringify(nd), log };
  }
  const reached = Math.abs(h.x - lv.goal.x) < 1.6 && Math.abs(h.y - lv.goal.y) < 1.2;
  return { ok: reached, why: reached ? '' : 'end at x=' + h.x.toFixed(1) + ' y=' + h.y.toFixed(1), log, t };
}
for (const lv of LEVELS) {
  const r = runBot(lv);
  T(lv.id + ' ボットが実際の物理でゴールに着く' + (r.t ? '（' + r.t.toFixed(1) + ' 秒）' : ''), r.ok, r.why + ' ' + (r.log || []).join(' '));
}

document.getElementById('sum').textContent = `${pass} PASS / ${fail} FAIL`;
document.title = (fail ? 'FAIL ' : 'OK ') + pass + '/' + (pass + fail);

</script>
</body>
</html>
