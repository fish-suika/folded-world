<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>折りたたまれた世界（仮）</title>
<style>
  :root{--ink:#4a3b2e;--paper:#fbf4e2;--gold:#ffb938;--coral:#ff7a5c;--leaf:#5fb86a;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#1d1a26;color:var(--ink);font-family:var(--jp);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  html,body{height:100vh;height:100dvh}
  button{font-family:var(--jp);touch-action:manipulation;cursor:pointer}

  /* ---- 16:9 の枠。画面に収まる最大の 16:9 を中央に置く ---- */
  #stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:16/9;
    width:min(100vw,calc(100vh*16/9));overflow:hidden;container-type:size;
    background:linear-gradient(#bfe6ff 0%,#e9f6ff 55%,#fff3d6 100%);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 60px rgba(0,0,0,.6)}
  @supports (height:100dvh){#stage{width:min(100vw,calc(100dvh*16/9))}}
  #view{position:absolute;inset:0}
  #view canvas{display:block;width:100%;height:100%}

  /* ---- HUD ---- */
  #hud{position:absolute;inset:0;pointer-events:none;display:none}
  body.playing #hud{display:block}
  .tag{position:absolute;top:2.2cqw;font-size:2cqw;font-weight:700;letter-spacing:.08em;padding:.5cqw 1.6cqw;border-radius:2cqw;
    background:rgba(251,244,226,.88);box-shadow:0 .3cqw 0 rgba(74,59,46,.18)}
  #tagStage{left:2.2cqw}
  #tagTime{right:2.2cqw;font-variant-numeric:tabular-nums}
  #tagShard{right:15cqw;color:#9a6b00}
  .cards{display:flex;flex-direction:column;gap:1.1cqw;margin-top:.2cqw}
  .wrow{display:flex;gap:1.4cqw;align-items:stretch;justify-content:center}
  .wlab{width:13cqw;display:flex;align-items:center;justify-content:center;font-size:1.7cqw;font-weight:700;letter-spacing:.06em;line-height:1.5}
  .card{width:20cqw;padding:.7cqw .8cqw;border:0;border-radius:2cqw;background:#fff;color:var(--ink);box-shadow:0 .6cqw 0 #cfc3a8;text-align:center;line-height:1.7}
  .card:active{transform:translateY(.4cqw);box-shadow:0 .2cqw 0 #cfc3a8}
  .card b{display:inline;font-size:1.9cqw;letter-spacing:.08em;margin-right:.6cqw}
  .card .nm{display:inline;font-size:1.8cqw;font-weight:700}
  .card .ht{display:block;font-size:1.25cqw;opacity:.7}
  .card .st{display:block;font-size:1.5cqw;color:#9a6b00;letter-spacing:.1em}
  .card.lock{opacity:.45;box-shadow:none;cursor:default}
  .card.done{background:#fff7da}
  #prompt{position:absolute;left:50%;top:13cqh;transform:translateX(-50%);font-size:2.4cqw;font-weight:800;letter-spacing:.1em;
    padding:.8cqw 2.4cqw;border-radius:3cqw;background:var(--gold);color:#4a2d00;box-shadow:0 .4cqw 0 #c47f00;display:none;white-space:nowrap}
  #prompt.warn{background:#ffe1d8;color:#8a2b12;box-shadow:0 .4cqw 0 #d98c78}
  #toast{position:absolute;left:50%;top:24cqh;transform:translateX(-50%);font-size:2.2cqw;font-weight:700;padding:.7cqw 2.2cqw;border-radius:3cqw;
    background:rgba(74,59,46,.88);color:#fff6e0;opacity:0;transition:opacity .25s}
  #toast.on{opacity:1}

  /* ---- 画面（タイトル・ポーズ・クリア） ---- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2cqw;
    background:rgba(255,246,224,.9);z-index:5}
  .screen.on{display:flex}
  .screen h1{font-size:6.4cqw;letter-spacing:.12em;color:var(--ink);text-shadow:.35cqw .35cqw 0 #ffd36b}
  .screen h2{font-size:5cqw;letter-spacing:.14em;text-shadow:.3cqw .3cqw 0 #ffd36b}
  .screen p{font-size:2.1cqw;line-height:1.9;letter-spacing:.06em}
  .screen small{font-size:1.7cqw;opacity:.75;letter-spacing:.05em;line-height:1.8}
  .btn{font-size:2.6cqw;font-weight:800;letter-spacing:.2em;padding:1cqw 5cqw;border:0;border-radius:4cqw;background:var(--coral);color:#fff;
    box-shadow:0 .6cqw 0 #c4482e;transition:transform .08s}
  .btn:active{transform:translateY(.4cqw);box-shadow:0 .2cqw 0 #c4482e}
  .btn.sub{background:#fff;color:var(--ink);box-shadow:0 .6cqw 0 #cfc3a8;font-size:2cqw;padding:.8cqw 3.4cqw}
  .row{display:flex;gap:2cqw;align-items:center}
  kbd{display:inline-block;min-width:3cqw;padding:0 .8cqw;border-radius:.8cqw;background:#fff;box-shadow:0 .3cqw 0 #cfc3a8;font-family:inherit;font-weight:700}

  /* ---- タッチ操作（スマホ） ---- */
  #touch{position:absolute;inset:0;display:none;pointer-events:none}
  body.touch.playing #touch{display:block}
  .tb{position:absolute;bottom:4cqh;width:12cqh;height:12cqh;border-radius:50%;border:0;pointer-events:auto;
    background:rgba(251,244,226,.72);color:var(--ink);font-size:3.4cqh;font-weight:800;box-shadow:0 .8cqh 0 rgba(74,59,46,.25)}
  .tb.down{background:var(--gold)}
  #bU{display:none;right:calc(3cqw + 29cqh);font-size:2.6cqh}
  body.double #bU{display:block}
  #bL{left:3cqw}#bR{left:calc(3cqw + 14.5cqh)}
  #bJ{right:3cqw}#bF{right:calc(3cqw + 14.5cqh);font-size:3cqh}
  body.canfold #bF{background:var(--gold);animation:pulse .8s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.1)}}

  /* ---- スマホが縦向きのときの案内 ---- */
  #rotate{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;
    text-align:center;background:#2a2234;color:#fbf4e2}
  #rotate .phone{width:46px;height:80px;border:4px solid #fbf4e2;border-radius:9px;position:relative;animation:turn 2.4s ease-in-out infinite}
  #rotate .phone::after{content:"";position:absolute;left:50%;bottom:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fbf4e2}
  @keyframes turn{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
  #rotate p{font-size:20px;letter-spacing:.1em;line-height:1.8}
  #rotate small{display:block;font-size:14px;opacity:.75;letter-spacing:.05em}
  @media (orientation: portrait) and (pointer: coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="rotate"><div class="phone"></div><p>横画面にしてください<small>スマホを横向きにすると遊べます</small></p></div>
<div id="stage">
  <div id="view"></div>
  <div id="hud">
    <div class="tag" id="tagStage">おためしの紙</div>
    <div class="tag" id="tagShard">◆ 0/3</div>
    <div class="tag" id="tagTime">0.0 s</div>
    <div id="prompt"></div>
    <div id="toast"></div>
  </div>
  <div id="touch">
    <button class="tb" id="bL">◀</button><button class="tb" id="bR">▶</button>
    <button class="tb" id="bU">戻す</button><button class="tb" id="bF">折る</button><button class="tb" id="bJ">跳ぶ</button>
  </div>

  <div class="screen on" id="scTitle">
    <h1>折りたたまれた世界</h1>
    <p>紙の世界を折って、道を作ろう。<br>折り目（点線）の近くで「折る」と、紙がパタンと反対側にかさなる。</p>
    <div class="row"><button class="btn" id="btnStart">はじめる</button></div>
    <small><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 移動　<kbd>Space</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> ジャンプ　<kbd>F</kbd> / <kbd>J</kbd> 折る・戻す　<kbd>U</kbd> / <kbd>Shift</kbd> 戻す　<kbd>R</kbd> やり直し　<kbd>Esc</kbd> ポーズ<br>（仮題・Phase 1：折りの面白さ確認）</small>
  </div>
  <div class="screen" id="scSelect">
    <h2>ワールド1　草原の紙</h2>
    <div class="cards" id="cards"></div>
    <small>小さな欠片は ◆ で数える（集めなくてもクリアできる）</small>
  </div>
  <div class="screen" id="scEnding">
    <h1>おしまい</h1>
    <p id="endInfo"></p>
    <small>遊んでくれて ありがとう。<br>小さな欠片を 20 個集めると、ひみつの紙が開く。</small>
    <div class="row"><button class="btn" id="btnEndSel">ステージ選択へ</button></div>
  </div>
  <div class="screen" id="scPause">
    <h2>ポーズ</h2>
    <div class="row"><button class="btn" id="btnResume">つづける</button><button class="btn sub" id="btnRetry">やり直す</button><button class="btn sub" id="btnToSelect1">ステージ選択</button></div>
  </div>
  <div class="screen" id="scClear">
    <h2>クリア！</h2>
    <p id="clearInfo"></p>
    <div class="row"><button class="btn" id="btnNext">つぎへ</button><button class="btn sub" id="btnAgain">もういちど</button><button class="btn sub" id="btnToSelect2">ステージ選択</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ===== 調整用の数値（ここだけ触れば遊び心地が変わる） =====
// 長さの単位は「マス目 1 つ = 1」。x は右、y は上。マス (cx,cy) は [cx,cx+1]×[cy,cy+1]。
const CFG = {
  hero: {
    hw: 0.32,        // 体の半分の幅
    h: 1.5,          // 体の高さ（足元が y）
    speed: 6.4,      // 走る速さ（マス/秒）
    accelG: 70,      // 地上の加速
    accelA: 42,      // 空中の加速（空中制御）
    frictionG: 80,   // 地上で止まる強さ
    gravity: 38,
    jumpV: 14.2,     // ジャンプの初速。最高到達 = jumpV^2/(2g) ≒ 2.65 マス
    cutV: 0.45,      // ジャンプボタンを離したときの上昇の減衰
    maxFall: 26,
    coyote: 0.09,    // 足場を離れても跳べる猶予
    buffer: 0.12,    // 着地前の先行入力
    deathY: -6,      // これより下に落ちたらやり直し
  },
  fold: {
    near: 9.5,       // 折り目からこの距離（マス）以内で「折る」が効く
    dur: 0.62,       // 折るアニメーションの長さ（この間は主人公も止まる）
    shakeDur: 0.4,   // 折れないときの震え
  },
  item: {
    shardR: 1.0,     // 小さな欠片を取れる距離（体の中心から）
    flagR: 1.1,      // 旗に触れる距離
    spikeH: 0.55,    // トゲの高さ（マスの下から）
  },
  solver: { stepUp: 2, maxGap: 3 },   // 検証用の「届く」判定（実物のジャンプより少し控えめ）
  cam: { fov: 36, dist: 21, smooth: 6, minY: 5.2 },
};

// ===== ワールド1（草原の紙）の3ステージ =====
// rects: 紙のマス（[x, y, 幅, 高さ]）。
// folds: 折り目。折り目 f の縦線で、幅 w・縦 y0〜y1（y1 は含まない）の「折れる耳」を
//        dir=+1 なら右側（[f, f+w)）、-1 なら左側（[f-w, f)）に持ち、主人公がいない側へパタンと折り返す。
//        耳は折り目を軸に鏡写しの位置（x → 2f-1-x）に来る。
//        back: 耳の「裏面」にだけある足場（[x, y, 幅, 高さ]、元の位置の座標）。折って裏返ったときだけ現れる。
// spikes: [x, y, 幅]。flags: チェックポイント。shards: 小さな欠片（back: 折り目の番号なら、その裏面にだけある）。
const LEVELS = [
  {
    id: '1-1', name: 'はじめの紙', hint: '折ると、遠くの紙が手前に来る',
    w: 60, h: 14,
    start: { x: 2.5, y: 2 }, goal: { x: 58.5, y: 2 },
    rects: [
      [0, 0, 16, 2],    // 地面 A
      [8, 2, 2, 3],     // 低い壁（耳 T0 の元）
      [24, 0, 26, 2],   // 地面 B（穴1の向こう）
      [41, 2, 4, 4],    // 崖（耳 T2 の元）
      [54, 0, 6, 2],    // 地面 C（穴2の向こう・ゴール）
    ],
    folds: [
      { f: 8,  w: 2, dir: 1, y0: 2, y1: 3 },   // T0 壁の足元を折って小さな段にする
      { f: 24, w: 6, dir: 1, y0: 1, y1: 2 },   // T1 向こう岸の地面の表面を板にして穴にかぶせる
      { f: 41, w: 2, dir: 1, y0: 2, y1: 4 },   // T2 崖の足元を折って階段にする
      { f: 54, w: 4, dir: 1, y0: 1, y1: 2 },   // T3 もう一度、向こう岸の板を引き寄せる
    ],
    spikes: [[36, 2, 2]],
    flags: [{ x: 33.5, y: 2 }, { x: 47.5, y: 2 }],
    shards: [{ x: 4, y: 4 }, { x: 20, y: 4 }, { x: 43, y: 8 }],
  },
  {
    id: '1-2', name: '紙のうら', hint: '折ると、裏にだけある足場が現れる',
    w: 64, h: 14,
    start: { x: 2.5, y: 2 }, goal: { x: 57.5, y: 8 },
    rects: [
      [0, 0, 15, 2],     // 地面 A
      [23, 0, 41, 2],    // 地面 B（穴の向こうからゴールの下まで）
      [40, 2, 4, 1],     // 出っ張り（耳 Tb の元）
      [50, 7, 10, 1],    // 高い所の床（ゴール）
    ],
    folds: [
      { f: 23, w: 8, dir: 1, y0: 2, y1: 3, back: [[23, 2, 8, 1]] },                    // Ta 裏面の橋
      { f: 40, w: 4, dir: 1, y0: 2, y1: 3 },                                            // Tb トゲにかぶせる板
      { f: 50, w: 4, dir: 1, y0: 3, y1: 7, back: [[52, 3, 2, 1], [50, 5, 2, 1]] },      // Tc 裏面の階段
    ],
    spikes: [[36, 2, 4]],
    flags: [{ x: 33.5, y: 2 }, { x: 46.5, y: 2 }],
    shards: [{ x: 26, y: 3, back: 0 }, { x: 37, y: 5 }, { x: 55, y: 10 }],
  },
  {
    id: '1-3', name: '折り重ねる', hint: '橋・板・階段を、順番に折っていく',
    w: 72, h: 14,
    start: { x: 2.5, y: 2 }, goal: { x: 68.5, y: 2 },
    rects: [
      [0, 0, 12, 2],     // 地面 A
      [20, 0, 16, 2],    // 地面 F1
      [42, 0, 30, 2],    // 地面 F2（ゴールまで）
      [53, 2, 3, 1],     // 出っ張り（耳 T4 の元）
    ],
    folds: [
      { f: 20, w: 8, dir: 1, y0: 3, y1: 6, back: [[26, 3, 2, 1], [24, 5, 2, 1], [22, 5, 2, 1], [20, 3, 2, 1]] },   // Td 裏面のアーチ
      { f: 42, w: 6, dir: 1, y0: 1, y1: 2 },   // T3 向こう岸の板
      { f: 53, w: 3, dir: 1, y0: 2, y1: 3 },   // T4 トゲにかぶせる板
    ],
    spikes: [[30, 2, 2], [50, 2, 3], [60, 2, 2]],
    flags: [{ x: 24.5, y: 2 }, { x: 48.5, y: 2 }],
    shards: [{ x: 16, y: 7 }, { x: 45, y: 4 }, { x: 61, y: 4 }],
  },
];

// ===== ワールド2・3・最終・ひみつ（部品を組み合わせて作る） =====
// 地面は行 0〜1（上面 y=2）。部品は x 位置を決めて置く。
const LB = {
  make(id, name, hint, world, theme, w, opts = {}) {
    return Object.assign({ id, name, hint, world, theme, w, h: 14, start: { x: 2.5, y: 2 }, rects: [], folds: [], spikes: [], flags: [], shards: [] }, opts);
  },
  ground(L, x, w) { L.rects.push([x, 0, w, 2]); },
  // 向こう岸の地面の表面（行1）を板にして、折り目 f の左側（穴）にかぶせる
  plankFront(L, f, w) { L.folds.push({ f, w, dir: 1, y0: 1, y1: 2 }); },
  // 裏面にだけある板（折るまで見えない）
  plankBack(L, f, w) { L.folds.push({ f, w, dir: 1, y0: 1, y1: 2, back: [[f, 1, w, 1]] }); },
  // トゲ [s, s+n) と、その右に出っ張りを置き、折ってトゲにかぶせる
  plate(L, s, n) { L.spikes.push([s, 2, n]); L.rects.push([s + n, 2, n, 1]); L.folds.push({ f: s + n, w: n, dir: 1, y0: 2, y1: 3 }); },
  // 高い崖（上面 top）。横の折り目（高さ 4）で上を折り下ろすと、上面が 4 になる
  cliff(L, x, w, top) { L.rects.push([x, 2, w, top - 2]); L.folds.push({ axis: 'y', f: 4, h: top - 4, dir: 1, x0: x, x1: x + w }); },
  // 空中の足場（2マス幅×n 段）。折り目の高さ 8 で折り下ろすと、上面 4, 6, 8… の階段になる
  stairs(L, x, n, gRow, gW) {
    for (let i = 0; i < n; i++) L.rects.push([x + 2 * i, 12 - 2 * i, 2, 1]);
    L.folds.push({ axis: 'y', f: 8, h: 5, dir: 1, x0: x, x1: x + 2 * n });
    if (gW > 0) L.rects.push([x + 2 * n, gRow, gW, 1]);
  },
};

LEVELS.forEach(l => { l.world = 1; l.theme = 'meadow'; });
LEVELS[2].big = 'yfold';   // 1-3 のゴールの大きな欠片：横の折り目

(function () {
  // 2-1 はじめの横折り
  let L = LB.make('2-1', 'たかさを折る', '横の折り目で、崖を低くする・高い足場を下ろす', 2, 'sunset', 48,
    { goal: { x: 42.5, y: 8 } });
  LB.ground(L, 0, 48); LB.cliff(L, 18, 4, 6);
  L.spikes.push([24, 2, 2]);
  LB.stairs(L, 28, 2, 7, 12);
  L.flags = [{ x: 15.5, y: 2 }, { x: 26.5, y: 2 }];
  L.shards = [{ x: 6, y: 4 }, { x: 20, y: 6 }, { x: 38, y: 10 }];
  LEVELS.push(L);

  // 2-2 崖と穴
  L = LB.make('2-2', 'がけと穴', '縦と横の折りを、順番に', 2, 'sunset', 64, { goal: { x: 62.5, y: 8 } });
  LB.ground(L, 0, 14); LB.ground(L, 22, 42);
  LB.plankFront(L, 22, 7);
  LB.cliff(L, 30, 3, 6);
  LB.plate(L, 40, 3);
  LB.stairs(L, 50, 2, 7, 10);
  L.flags = [{ x: 24.5, y: 2 }, { x: 38.5, y: 2 }, { x: 48.5, y: 2 }];
  L.shards = [{ x: 18, y: 4 }, { x: 31, y: 6 }, { x: 58, y: 10 }];
  LEVELS.push(L);

  // 2-3 さかさの塔（ワールド2の最後：大きな欠片＝二重折り）
  L = LB.make('2-3', 'さかさの塔', '板と階段で空へ。最後の塔を低くする', 2, 'sunset', 44, { goal: { x: 39.5, y: 10 }, big: 'double' });
  LB.ground(L, 0, 8); LB.ground(L, 16, 16);
  LB.plankFront(L, 16, 7);
  LB.stairs(L, 18, 3, 7, 9);                  // 階段（3段）と、空中の床 [24, 33)
  L.rects.push([31, 8, 2, 5]);                // 床の上の塔（行 8〜12）
  L.folds.push({ axis: 'y', f: 10, h: 3, dir: 1, x0: 31, x1: 33 });   // 塔の上を折り下ろす
  L.rects.push([33, 9, 8, 1]);                // 塔のむこうの床（上面 10）
  L.spikes.push([26, 8, 2]);
  L.flags = [{ x: 24.5, y: 8 }, { x: 34.5, y: 10 }];
  L.shards = [{ x: 12, y: 4 }, { x: 21, y: 8 }, { x: 37, y: 12 }];
  LEVELS.push(L);

  // 3-1 ふたつ同時（二重折り）
  L = LB.make('3-1', 'ふたつ同時', '2か所を同時に折る。裏の板を先に', 3, 'night', 48, { goal: { x: 46.5, y: 2 }, maxFolds: 2 });

// ===== 盤面・折りのルール・主人公の物理・到達検証（three.js を使わない部分） =====
const HERO = CFG.hero;
const popcount = m => { let c = 0; while (m) { c += m & 1; m >>= 1; } return c; };

class World {
  constructor(level) {
    this.W = level.w; this.H = level.h;
    this.maxFolds = level.maxFolds || 1;   // 同時に折れる数（二重折りは 2）
    this.base = new Uint8Array(this.W * this.H);
    for (const [x, y, w, h] of level.rects)
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.base[j * this.W + i] = 1;
    this.folds = level.folds.map(f => {
      const back = new Set();   // 裏面にだけある足場（元の位置の座標）
      for (const [x, y, w, h] of (f.back || []))
        for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) back.add(j * this.W + i);
      if (f.axis === 'y') {     // 横の折り目（上下に折る）：耳は x0〜x1、折り目の高さ f から上(dir=+1)か下(-1)へ h
        const y0 = f.dir > 0 ? f.f : f.f - f.h;
        return { axis: 'y', f: f.f, dir: f.dir, x0: f.x0, x1: f.x1, y0, y1: y0 + f.h, back };
      }
      const x0 = f.dir > 0 ? f.f : f.f - f.w;   // 縦の折り目（左右に折る）
      return { axis: 'x', f: f.f, dir: f.dir, x0, x1: x0 + f.w, y0: f.y0, y1: f.y1, back };
    });
    this.spikes = [];
    for (const [x, y, w] of (level.spikes || [])) for (let i = 0; i < w; i++) this.spikes.push({ cx: x + i, cy: y, back: -1 });
    this.shards = (level.shards || []).map(s => ({ cx: s.x, cy: s.y, back: s.back === undefined ? -1 : s.back }));
    this.flags = (level.flags || []).map(f => ({ cx: Math.floor(f.x), cy: f.y, x: f.x, y: f.y }));
    this.mask = 0;      // 折っている折り目（ビット i = i 番）
  }
  isOn(i, mask = this.mask) { return (mask >> i & 1) === 1; }
  // 鏡写しの位置
  mir(fd, cx, cy) { return fd.axis === 'x' ? [2 * fd.f - 1 - cx, cy] : [cx, 2 * fd.f - 1 - cy]; }
  inSource(fd, cx, cy) { return cx >= fd.x0 && cx < fd.x1 && cy >= fd.y0 && cy < fd.y1; }
  inTarget(fd, cx, cy) { const m = this.mir(fd, cx, cy); return this.inSource(fd, m[0], m[1]); }
  baseSolid(cx, cy) { return cx >= 0 && cx < this.W && cy >= 0 && cy < this.H && this.base[cy * this.W + cx] === 1; }
  // 耳の元の位置にある固いマス（表の紙＋裏面の足場）
  srcSolid(fd, cx, cy) {
    return this.baseSolid(cx, cy) || (cx >= 0 && cx < this.W && cy >= 0 && cy < this.H && fd.back.has(cy * this.W + cx));
  }
  // 折り状態（mask）を考慮した「そこは固い？」。紙の左右の端は見えない壁、下は落ちる
  solid(cx, cy, mask = this.mask) {
    if (cx < 0 || cx >= this.W) return true;
    if (cy < 0 || cy >= this.H) return false;
    let s = this.base[cy * this.W + cx] === 1;
    if (mask) {
      for (let i = 0; i < this.folds.length; i++) {
        if (!(mask >> i & 1)) continue;
        const fd = this.folds[i];
        if (s && this.inSource(fd, cx, cy)) s = false;
      }
      if (!s) for (let i = 0; i < this.folds.length; i++) {
        if (!(mask >> i & 1)) continue;
        const fd = this.folds[i];
        if (this.inTarget(fd, cx, cy)) { const m = this.mir(fd, cx, cy); if (this.srcSolid(fd, m[0], m[1])) { s = true; break; } }
      }
    }
    return s;
  }
  // 折り目 i が折り返したマスか
  isLayerOf(i, cx, cy) {
    const fd = this.folds[i];
    if (!this.inTarget(fd, cx, cy)) return false;
    const m = this.mir(fd, cx, cy);
    return this.srcSolid(fd, m[0], m[1]);
  }
  // 元の位置に残っている紙のマス
  isKept(cx, cy, mask = this.mask) {
    if (!this.baseSolid(cx, cy)) return false;
    for (let i = 0; i < this.folds.length; i++) if ((mask >> i & 1) && this.inSource(this.folds[i], cx, cy)) return false;
    return true;
  }
  // アイテム（トゲ・欠片）が今いるマス。裏面にだけあるものは、その折り目を折っているときだけ現れる
  itemCell(it, mask = this.mask) {
    if (it.back >= 0) {
      if (!(mask >> it.back & 1)) return null;
      return this.mir(this.folds[it.back], it.cx, it.cy);
    }
    for (let i = 0; i < this.folds.length; i++)
      if ((mask >> i & 1) && this.inSource(this.folds[i], it.cx, it.cy)) return this.mir(this.folds[i], it.cx, it.cy);
    return [it.cx, it.cy];
  }
  // 働いているトゲのマス（板でふさがれたら働かない）
  spikeCell(sp, mask = this.mask) {
    const c = this.itemCell(sp, mask);
    return c && !this.solid(c[0], c[1], mask) ? c : null;
  }
  // 耳の折り先の範囲
  targetRect(fd) {
    return fd.axis === 'x'
      ? { x0: 2 * fd.f - fd.x1, x1: 2 * fd.f - fd.x0, y0: fd.y0, y1: fd.y1 }
      : { x0: fd.x0, x1: fd.x1, y0: 2 * fd.f - fd.y1, y1: 2 * fd.f - fd.y0 };
  }
}

// 主人公の体が重なるマスの範囲 [x0,x1,y0,y1]
function heroCells(x, y) {
  return [Math.floor(x - HERO.hw + 1e-6), Math.floor(x + HERO.hw - 1e-6),
          Math.floor(y + 1e-6), Math.floor(y + HERO.h - 1e-6)];
}

function hitsSpike(w, h) {
  for (const sp of w.spikes) {
    const c = w.spikeCell(sp);
    if (!c) continue;
    if (h.x + HERO.hw > c[0] + 0.1 && h.x - HERO.hw < c[0] + 0.9 && h.y < c[1] + CFG.item.spikeH && h.y + HERO.h > c[1]) return true;
  }
  return false;
}

// 折り目までの距離（ガイドと「いちばん近い折り目」の選択用）
function hingeDist(fd, x, y) {
  if (fd.axis === 'x') return Math.hypot(x - fd.f, Math.max(0, fd.y0 - y, y - fd.y1));
  return Math.hypot(y - fd.f, Math.max(0, fd.x0 - x, x - fd.x1));
}

// 2つの耳を同時に折れる？（耳の元どうしが重ならない／折り先が相手の紙に乗らない）
function compatible(w, i, j) {
  const a = w.folds[i], b = w.folds[j];
  const ov = (p, q) => p.x0 < q.x1 && q.x0 < p.x1 && p.y0 < q.y1 && q.y0 < p.y1;
  if (ov(a, b)) return false;
  const hit = (tgt, src) => {
    for (let cy = Math.max(tgt.y0, src.y0); cy < Math.min(tgt.y1, src.y1); cy++)
      for (let cx = Math.max(tgt.x0, src.x0); cx < Math.min(tgt.x1, src.x1); cx++)
        if (w.baseSolid(cx, cy)) return true;
    return false;
  };
  return !hit(w.targetRect(a), b) && !hit(w.targetRect(b), a);
}

// 折れる？  { ok, why }  why: far / side / active / max / compat / overlap / onTab
function canFold(w, i, x, y) {
  const fd = w.folds[i];
  if (w.isOn(i)) return { ok: false, why: 'active' };
  if (popcount(w.mask) >= w.maxFolds) return { ok: false, why: 'max' };
  for (let j = 0; j < w.folds.length; j++) if (w.isOn(j) && !compatible(w, i, j)) return { ok: false, why: 'compat' };
  if (fd.axis === 'x') {
    if (fd.dir > 0 ? x >= fd.f : x <= fd.f) return { ok: false, why: 'side' };   // 主人公は耳の反対側にいる
    if (Math.abs(x - fd.f) > CFG.fold.near || y < fd.y0 - 5 || y > fd.y1 + 6) return { ok: false, why: 'far' };
  } else {
    if (fd.dir > 0 ? y >= fd.f : y < fd.f) return { ok: false, why: 'side' };
    if (Math.abs(y - fd.f) > CFG.fold.near || x < fd.x0 - 4 || x > fd.x1 + 4) return { ok: false, why: 'far' };
  }
  const [x0, x1, y0, y1] = heroCells(x, y);
  const row = Math.floor(y - 0.05);
  for (let cx = x0; cx <= x1; cx++) {
    for (let cy = y0; cy <= y1; cy++) {
      if (w.inTarget(fd, cx, cy)) { const m = w.mir(fd, cx, cy); if (w.srcSolid(fd, m[0], m[1])) return { ok: false, why: 'overlap' }; }
    }
    if (w.inSource(fd, cx, row) && w.baseSolid(cx, row)) return { ok: false, why: 'onTab' };   // 耳の上に乗っている
  }
  return { ok: true };
}

// 折り目 j を戻せる？  { ok, carried, nx }  耳の上に乗っていたら、耳ごと元の位置へ運ばれる（縦の折り目のみ）
function canUnfold(w, j, x, y) {
  if (!w.isOn(j)) return { ok: false, why: 'none' };
  const fd = w.folds[j];
  const [x0, x1] = heroCells(x, y);
  const row = Math.floor(y - 0.05);
  let kept = false, onJ = false, onOther = false;
  for (let cx = x0; cx <= x1; cx++) {
    if (w.isKept(cx, row)) { kept = true; continue; }
    for (let k = 0; k < w.folds.length; k++) {
      if (!w.isOn(k) || !w.isLayerOf(k, cx, row)) continue;
      if (k === j) onJ = true; else onOther = true;
    }
  }
  const carried = onJ && !kept && !onOther;
  if (carried && fd.axis === 'y') return { ok: false, why: 'onLayer' };   // 上下の折りは運べない
  const nx = carried ? 2 * fd.f - x : x;
  const mask2 = w.mask & ~(1 << j);
  const [a0, a1, b0, b1] = heroCells(nx, y);
  for (let cx = a0; cx <= a1; cx++) for (let cy = b0; cy <= b1; cy++)
    if (w.solid(cx, cy, mask2)) return { ok: false, why: 'overlap' };   // 戻すと紙に埋まる
  if (onJ) {   // 戻した後の足場があるか（裏面の足場の上で戻すと落ちる）
    let sup = false;
    for (let cx = a0; cx <= a1; cx++) if (w.solid(cx, row, mask2)) sup = true;
    if (!sup) return { ok: false, why: 'void' };
  }
  return { ok: true, carried, nx };
}

// ---- 主人公の物理（足元が y、中心が x） ----
function newHero(level, at) {
  const s = at || level.start;
  return { x: s.x, y: s.y, vx: 0, vy: 0, ground: true, face: 1, coyote: 0, buf: 0, jumping: false, jumped: false, landed: 0 };
}

// inp: { left, right, jumpHeld, jumpPressed }
function stepHero(w, h, inp, dt) {
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const target = dir * HERO.speed;

  else if (h.vx > target) h.vx = Math.max(target, h.vx - acc * dt);

  h.buf = inp.jumpPressed ? HERO.buffer : Math.max(0, h.buf - dt);

  if (h.jumping && !inp.jumpHeld && h.vy > 0) { h.vy *= HERO.cutV; h.jumping = false; }

    for (let cy = r[2]; cy <= r[3]; cy++) if (w.solid(cx, cy)) { nx = cx + 1 + HERO.hw + 1e-4; h.vx = 0; break; }
  }

  h.ground = false;

    const cy = Math.floor(ny);

      }

    const cy = Math.floor(ny + HERO.h);
    for (let cx = bx0; cx <= bx1; cx++) if (w.solid(cx, cy)) { ny = cy - HERO.h - 1e-4; h.vy = 0; h.jumping = false; break; }
  }
  h.y = ny;
}

// ---- 到達検証：「立てるマス」の間を、歩き・ジャンプ・折る・戻すでつないで、目的に着けるか ----
function surfaces(w, cx, mask) {
  const out = [];
  if (cx < 0 || cx >= w.W) return out;
  for (let y = 1; y < w.H - 2; y++)
    if (w.solid(cx, y - 1, mask) && !w.solid(cx, y, mask) && !w.solid(cx, y + 1, mask)) out.push(y);
  return out;
}

function spikeAtNode(w, mask, cx, y) {
  for (const sp of w.spikes) { const c = w.spikeCell(sp, mask); if (c && c[0] === cx && c[1] === y) return true; }
  return false;
}

// goalFn(mask, cx, y) が真になる立ち位置まで。返り値 nodes: [{m,cx,y,kind,i}]（kind: start/move/jump/fold/unfold）
function solve(w, level, opts = {}) {

  const sx = Math.floor(level.start.x), sy = level.start.y;
  const prev = new Map(), q = [[0, sx, sy]];
  prev.set(key(0, sx, sy), { from: null, node: { m: 0, cx: sx, y: sy, kind: 'start' } });
  const save = w.mask;
  let found = null;
  const push = (from, m, cx, y, kind, i) => {
    const k = key(m, cx, y);
    if (prev.has(k)) return;
    if (spikeAtNode(w, m, cx, y)) return;
    prev.set(k, { from, node: { m, cx, y, kind, i } });
    q.push([m, cx, y]);
  };

    if (goalFn(m, cx, y)) { found = key(m, cx, y); break; }
    const from = key(m, cx, y);
    for (let dx = -CFG.solver.maxGap; dx <= CFG.solver.maxGap; dx++) {
      if (dx === 0) continue;
      const nx = cx + dx, step = Math.sign(dx);
      let blocked = false;
      for (let k = cx + step; k !== nx; k += step)
        if (w.solid(k, y + 2, m) || w.solid(k, y + 3, m)) { blocked = true; break; }
      if (blocked) continue;
      let ys = surfaces(w, nx, m).filter(v => v <= y + CFG.solver.stepUp);
      // 上へ跳ぶときは、出発の列の頭上が空いている（天井にぶつからない）
      ys = ys.filter(v => { for (let r = y + 2; r <= v + 1; r++) if (w.solid(cx, r, m)) return false; return true; });

  return { solvable: true, nodes, steps: nodes.slice(1).map(n => n.kind + (n.i !== undefined ? ' ' + n.i : '')), folds: nodes.filter(n => n.kind === 'fold').length };
}

// 小さな欠片 s に、折りを使って届く立ち位置があるか
function shardGoal(w, s) {
  return (m, cx, y) => {
    const c = w.itemCell(s, m);
    if (!c) return false;
    const dy = (c[1] + 0.5) - (y + 0.75);
    return Math.abs(c[0] - cx) <= 1 && dy >= -1 && dy <= 2.2;

  let heroRoot, heroBody, heroTail;
  let foldGroups = [], markers = [], backMeshes = [], shardMeshes = [], spikeMeshes = [], flagMeshes = [], flag, flagGlow;
  let camX = 0, camY = 6, bigShard = null;
  const D = 0.5;            // 紙の厚み（奥行き）

  // ---- 紙のテクスチャ（繊維とざらつきを canvas で生成） ----
  function paperTex(seed) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 128);
    let s = seed * 9301 + 49297;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    for (let i = 0; i < 900; i++) {
      const x = rnd() * 128, y = rnd() * 128, l = 3 + rnd() * 9, a = rnd() * Math.PI;
      g.strokeStyle = rnd() < 0.5 ? 'rgba(120,100,70,0.07)' : 'rgba(255,255,255,0.35)';
      g.lineWidth = 0.6 + rnd() * 0.8;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(90,70,40,${rnd() * 0.06})`; g.fillRect(rnd() * 128, rnd() * 128, 1.5, 1.5); }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }
  const TEX = {};
  const mat = (color, tex) => new THREE.MeshLambertMaterial({ color, map: tex || TEX.a });

  const M = {};
  function makeMaterials() {
    TEX.a = paperTex(1); TEX.b = paperTex(7);
    M.edge = mat(0xfaf3df);
    M.ground = mat(0x93d38c);   M.groundBack = mat(0x6fae7a, TEX.b);
    M.wall = mat(0x8ec5ee);     M.wallBack = mat(0x6a9fcf, TEX.b);
    M.tab = mat(0xffd76f);      M.tabBack = mat(0xff8a66, TEX.b);   // 耳は黄色、裏は珊瑚色
    M.cap = mat(0x5fb86a);      M.capTab = mat(0xffb938);  M.capBack = mat(0xe0563a);
    M.spike = new THREE.MeshLambertMaterial({ color: 0x6b6f86 });
    M.shard = new THREE.MeshLambertMaterial({ color: 0xffd23a, emissive: 0x7a5a00 });
    M.ghost = new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.28, depthWrite: false });
    M.ghostLine = new THREE.LineBasicMaterial({ color: 0xd9a400 });
  }

  const boxGeo = new THREE.BoxGeometry(1, 1, D);
  const capGeo = new THREE.BoxGeometry(1.0, 0.2, D + 0.04);
  const spikeGeo = new THREE.ConeGeometry(0.2, 0.55, 4);
  const shardGeo = new THREE.OctahedronGeometry(0.34);

  function cellMesh(front, back) {
    // 面の順: +x, -x, +y, -y, +z, -z
    const m = new THREE.Mesh(boxGeo, [M.edge, M.edge, M.edge, M.edge, front, back]);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }

  function buildLevel(world, level) {
    const W = world.W, H = world.H;
    // 耳のグループ内での位置（折り目を原点にした座標）
    const loc = (fd, cx, cy) => fd.axis === 'x' ? [cx + 0.5 - fd.f, cy + 0.5] : [cx + 0.5, cy + 0.5 - fd.f];
    const inFold = (cx, cy) => world.folds.findIndex(fd => world.inSource(fd, cx, cy));
    foldGroups = world.folds.map(fd => {
      const g = new THREE.Group();
      g.position.set(fd.axis === 'x' ? fd.f : 0, fd.axis === 'y' ? fd.f : 0, 0);       // 折り目を軸に回る
      levelRoot.add(g);
      return g;
    });
    for (let cy = 0; cy < H; cy++) for (let cx = 0; cx < W; cx++) {
      if (!world.baseSolid(cx, cy)) continue;
      const fi = inFold(cx, cy);
      const isTab = fi >= 0;
      const m = isTab ? cellMesh(M.tab, M.tabBack) : (cy >= 2 ? cellMesh(M.wall, M.wallBack) : cellMesh(M.ground, M.groundBack));
      if (isTab) m.scale.z = 0.92;
      const open = !world.baseSolid(cx, cy + 1);
      if (isTab) { const p = loc(world.folds[fi], cx, cy); m.position.set(p[0], p[1], 0); }
      else m.position.set(cx + 0.5, cy + 0.5, 0);
      (isTab ? foldGroups[fi] : levelRoot).add(m);
      if (open) {
        const cap = new THREE.Mesh(capGeo, isTab ? M.capTab : M.cap);
        cap.position.set(m.position.x, m.position.y + 0.4, 0);
        cap.receiveShadow = true;
        (isTab ? foldGroups[fi] : levelRoot).add(cap);
      }
    }
    // 耳の「ゴースト」（耳の範囲を薄い黄色で示す。裏面だけの耳もここで見える）と、裏面の足場
    backMeshes = [];
    world.folds.forEach((fd, i) => {
      const g = foldGroups[i];
      const lc = loc(fd, (fd.x0 + fd.x1) / 2 - 0.5, (fd.y0 + fd.y1) / 2 - 0.5), cxm = lc[0], cym = lc[1];
      const gw = fd.x1 - fd.x0, gh = fd.y1 - fd.y0;
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(gw, gh), M.ghost);
      plane.position.set(cxm, cym, D / 2 + 0.03);
      const line = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(gw, gh)), M.ghostLine);
      line.position.set(cxm, cym, D / 2 + 0.04);
      g.add(plane, line);
      const list = [];
      fd.back.forEach(k => {
        const cx = k % W, cy = Math.floor(k / W);
        const m = cellMesh(M.tabBack, M.tabBack);
        m.scale.z = 0.92;
        { const p = loc(fd, cx, cy); m.position.set(p[0], p[1], 0); }
        g.add(m); list.push(m);
        if (!fd.back.has((cy + 1) * W + cx)) {
          const cap = new THREE.Mesh(capGeo, M.capBack);
          cap.position.set(m.position.x, m.position.y + 0.4, 0);
          g.add(cap); list.push(cap);
        }
      });
      backMeshes.push(list);
    });
    // 折り目の点線
    markers = world.folds.map(fd => {
      const g = new THREE.Group();
      const m = new THREE.MeshBasicMaterial({ color: 0x8a7a66 });
      if (fd.axis === 'x') {
        const top = fd.y1 + 1.4, bot = fd.y0 - 0.2;
        for (let y = bot; y < top; y += 0.55) {
          const d = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.32, 0.1), m);
          d.position.set(fd.f, y + 0.16, D / 2 + 0.06);
          g.add(d);
        }
      } else {
        for (let x = fd.x0 - 0.5; x < fd.x1 + 0.5; x += 0.55) {
          const d = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.1, 0.1), m);
          d.position.set(x + 0.16, fd.f, D / 2 + 0.06);
          g.add(d);
        }
      }
      g.userData.mat = m;
      levelRoot.add(g);
      return g;
    });
    // トゲ
    spikeMeshes = world.spikes.map(sp => {
      const fi = sp.back >= 0 ? sp.back : inFold(sp.cx, sp.cy);
      const g = new THREE.Group();
      for (let k = 0; k < 2; k++) {
        const c = new THREE.Mesh(spikeGeo, M.spike);
        c.position.set(-0.25 + k * 0.5, 0.275, 0); c.castShadow = true; g.add(c);
      }
      if (fi >= 0) { const p = loc(world.folds[fi], sp.cx, sp.cy); g.position.set(p[0], p[1] - 0.5, 0); foldGroups[fi].add(g); }
      else { g.position.set(sp.cx + 0.5, sp.cy, 0); levelRoot.add(g); }
      return { g, sp, fi };
    });
    // 小さな欠片
    shardMeshes = world.shards.map(s => {
      const fi = s.back >= 0 ? s.back : inFold(s.cx, s.cy);
      const m = new THREE.Mesh(shardGeo, M.shard);
      m.scale.set(1, 1.3, 0.45); m.castShadow = true;
      if (fi >= 0) { const p = loc(world.folds[fi], s.cx, s.cy); m.position.set(p[0], p[1], 0); foldGroups[fi].add(m); }
      else { m.position.set(s.cx + 0.5, s.cy + 0.5, 0); levelRoot.add(m); }
      return { m, s, fi };
    });
    // チェックポイント旗
    flagMeshes = world.flags.map(f => {
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.5, 0.07), new THREE.MeshLambertMaterial({ color: 0xfaf3df }));
      pole.position.y = 0.75;
      const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(0.7, 0.22); s.lineTo(0, 0.44); s.closePath();
      const cm = new THREE.MeshLambertMaterial({ color: 0xb8b2a5, side: THREE.DoubleSide });
      const cloth = new THREE.Mesh(new THREE.ShapeGeometry(s), cm);
      cloth.position.set(0.04, 1.0, 0);
      g.add(pole, cloth);
      g.position.set(f.x, f.y, -0.5);
      levelRoot.add(g);
      return { g, cm, cloth };
    });
    // ゴール旗
    flag = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.6, 0.1), new THREE.MeshLambertMaterial({ color: 0xfaf3df }));
    pole.position.y = 1.3;
    const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(1.3, 0.4); s.lineTo(0, 0.8); s.closePath();
    const cloth = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshLambertMaterial({ color: 0xff5d7a, side: THREE.DoubleSide }));
    cloth.position.set(0.05, 1.85, 0);
    flagGlow = new THREE.Mesh(new THREE.CircleGeometry(1.1, 24), new THREE.MeshBasicMaterial({ color: 0xffe27a, transparent: true, opacity: 0.35 }));
    flagGlow.position.set(0.5, 1.8, -0.2);
    flag.add(pole, cloth, flagGlow);
    if (level.big) {
      bigShard = new THREE.Mesh(new THREE.OctahedronGeometry(0.75), M.shard);
      bigShard.scale.set(1, 1.35, 0.5); bigShard.position.set(0.2, 4.0, 0); bigShard.castShadow = true;
      flag.add(bigShard);
    } else bigShard = null;
    flag.position.set(level.goal.x, level.goal.y, 0);
    flag.userData.cloth = cloth;
    levelRoot.add(flag);
  }

  // ---- 背景：紙の切り絵を何層も重ねる ----
  function hill(color, z, baseY, amp, freq, phase, x0, x1) {
    const s = new THREE.Shape();
    s.moveTo(x0, -30);
    for (let x = x0; x <= x1; x += 1.5) s.lineTo(x, baseY + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 2.3 + phase * 1.7) * amp * 0.4);
    s.lineTo(x1, -30); s.closePath();
    const m = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshLambertMaterial({ color, map: TEX.b }));
    m.position.z = z;
    bgRoot.add(m);
  }
  function cloud(x, y, z, sc) {
    const g = new THREE.Group();
    const mt = new THREE.MeshLambertMaterial({ color: 0xffffff, map: TEX.a });
    [[0, 0, 1.6], [1.5, 0.3, 1.2], [-1.5, 0.2, 1.1], [0.6, 0.9, 1.0]].forEach(([dx, dy, r]) => {
      const c = new THREE.Mesh(new THREE.CircleGeometry(r, 20), mt); c.position.set(dx, dy, 0); g.add(c);
    });
    g.position.set(x, y, z); g.scale.setScalar(sc); bgRoot.add(g);
  }
  function tree(x, z, sc, col) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.9), new THREE.MeshLambertMaterial({ color: 0xa87b52, map: TEX.b }));
    trunk.position.y = 0.45; g.add(trunk);
    for (let i = 0; i < 3; i++) {
      const s = new THREE.Shape(); const w = 1.5 - i * 0.3;
      s.moveTo(-w, 0); s.lineTo(w, 0); s.lineTo(0, 1.5); s.closePath();
      const t = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshLambertMaterial({ color: col, map: TEX.a }));
      t.position.set(0, 0.7 + i * 0.75, 0.01 * i); g.add(t);
    }
    g.position.set(x, 2, z); g.scale.setScalar(sc); bgRoot.add(g);
  }
  const THEMES = {
    meadow: { sky: 'linear-gradient(#bfe6ff 0%,#e9f6ff 55%,#fff3d6 100%)', ground: 0x93d38c, groundBack: 0x6fae7a, cap: 0x5fb86a, wall: 0x8ec5ee, wallBack: 0x6a9fcf,
              hills: [0xcfe9d4, 0xb5dcb8, 0x9ccf9e], trees: [0x5aa96a, 0x7bc27f], hemi: [0xffffff, 0xb8d8b0, 0.78], sun: 0xfff0d0 },
    sunset: { sky: 'linear-gradient(#ff9d73 0%,#ffc79a 50%,#ffe9c2 100%)', ground: 0xf2b184, groundBack: 0xcf8a62, cap: 0xd9783a, wall: 0xe98fa0, wallBack: 0xc26e82,
              hills: [0xf8cdb0, 0xf0ab94, 0xdc8b7c], trees: [0xc4654f, 0xe28a6a], hemi: [0xfff1e0, 0xd9a98c, 0.82], sun: 0xffd9a8 },
    night:  { sky: 'linear-gradient(#141a48 0%,#2f3a7a 55%,#5a5aa8 100%)', ground: 0x5b6dbc, groundBack: 0x434f94, cap: 0x8b9af0, wall: 0x7a64b8, wallBack: 0x5a4a96,
              hills: [0x4a549a, 0x38417f, 0x2c3468], trees: [0x3f4ea6, 0x4a9fb4], hemi: [0xc2c9ff, 0x4a5090, 0.8], sun: 0xc6ccff, stars: true },
    gold:   { sky: 'linear-gradient(#ffe27a 0%,#fff0b8 55%,#ffffff 100%)', ground: 0xf6d568, groundBack: 0xd9b33f, cap: 0xe8a820, wall: 0xffb86b, wallBack: 0xd9904a,
              hills: [0xfff0c0, 0xffe39a, 0xffd37a], trees: [0xe0a33a, 0xf2c25a], hemi: [0xffffff, 0xffe6a0, 0.85], sun: 0xfff4d0 },
  };
  function applyTheme(name) {
    const t = THEMES[name] || THEMES.meadow;
    M.ground.color.setHex(t.ground); M.groundBack.color.setHex(t.groundBack); M.cap.color.setHex(t.cap);
    M.wall.color.setHex(t.wall); M.wallBack.color.setHex(t.wallBack);
    hemi.color.setHex(t.hemi[0]); hemi.groundColor.setHex(t.hemi[1]); hemi.intensity = t.hemi[2];
    sun.color.setHex(t.sun);
    container.parentElement.style.background = t.sky;
    while (bgRoot.children.length) bgRoot.remove(bgRoot.children[0]);
    hill(t.hills[0], -26, 4.5, 3.2, 0.11, 0.5, -40, 150);
    hill(t.hills[1], -18, 3.2, 2.6, 0.16, 2.0, -40, 150);
    hill(t.hills[2], -11, 2.4, 1.8, 0.22, 4.2, -40, 150);
    if (t.stars) {
      const sm = new THREE.MeshBasicMaterial({ color: 0xffe9a0 });
      for (let i = 0; i < 70; i++) {
        const s = new THREE.Mesh(new THREE.CircleGeometry(0.12 + (i % 4) * 0.05, 5), sm);
        s.position.set(-10 + (i * 37) % 130, 6 + (i * 53) % 12, -30);
        bgRoot.add(s);
      }
    } else {
      [[6, 11, -22, 1.4], [26, 12.5, -24, 1.7], [48, 10.5, -20, 1.3], [66, 12, -25, 1.8], [-8, 12, -23, 1.5], [86, 11, -22, 1.5], [108, 12, -24, 1.6]].forEach(a => cloud(...a));
    }
    for (let i = 0; i < 40; i++) tree(2 + i * 3.1 + (i % 3) * 0.7, -2.4 - (i % 4) * 0.4, 1.0 + (i % 5) * 0.12, t.trees[i % 2]);
  }

  // ---- 主人公：折り紙のキツネ「カミ」 ----
  function buildHero() {
    heroRoot = new THREE.Group();
    heroBody = new THREE.Group();     // つぶれ・のびはここ（足元が原点）
    heroRoot.add(heroBody);
    const orange = new THREE.MeshLambertMaterial({ color: 0xff8f3a, map: TEX.a });
    const white = new THREE.MeshLambertMaterial({ color: 0xfffaf0, map: TEX.a });
    const dark = new THREE.MeshLambertMaterial({ color: 0x3a2a20 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.62, 0.34), orange); body.position.set(0, 0.55, 0);
    const belly = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.4, 0.04), white); belly.position.set(0.1, 0.5, 0.19);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.46, 0.4), orange); head.position.set(0.12, 1.12, 0);
    const snout = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.34, 4), white); snout.rotation.z = -Math.PI / 2; snout.position.set(0.56, 1.05, 0);
    const nose = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), dark); nose.position.set(0.72, 1.05, 0);
    const earG = new THREE.ConeGeometry(0.16, 0.42, 4);
    const ear1 = new THREE.Mesh(earG, orange); ear1.position.set(0.0, 1.5, 0.12);
    const ear2 = new THREE.Mesh(earG, orange); ear2.position.set(0.24, 1.5, -0.12);
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.12, 0.05), dark); eye.position.set(0.36, 1.18, 0.21);
    const eye2 = eye.clone(); eye2.position.z = -0.21;
    heroTail = new THREE.Group(); heroTail.position.set(-0.3, 0.45, 0);
    const tailM = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.85, 4), orange); tailM.rotation.z = Math.PI / 2 + 0.5; tailM.position.set(-0.4, 0.1, 0);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 4), white); tip.rotation.z = Math.PI / 2 + 0.5; tip.position.set(-0.78, 0.3, 0);
    heroTail.add(tailM, tip);
    const legs = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.24, 0.3), orange); legs.position.set(0, 0.12, 0);
    [body, belly, head, snout, nose, ear1, ear2, eye, eye2, tailM, tip, legs].forEach(m => { m.castShadow = true; });
    heroBody.add(body, belly, head, snout, nose, ear1, ear2, eye, eye2, heroTail, legs);
    scene.add(heroRoot);
  }

  function init(el) {
    container = el;
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(CFG.cam.fov, 16 / 9, 0.5, 200);
    hemi = new THREE.HemisphereLight(0xffffff, 0xb8d8b0, 0.78); scene.add(hemi);
    sun = new THREE.DirectionalLight(0xfff0d0, 0.85);
    sun.position.set(-8, 18, 16);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const sc = sun.shadow.camera; sc.left = -22; sc.right = 22; sc.top = 14; sc.bottom = -8; sc.near = 1; sc.far = 60;
    sun.shadow.bias = -0.0005;
    scene.add(sun); scene.add(sun.target);
    makeMaterials();
    bgRoot = new THREE.Group(); scene.add(bgRoot);
    buildHero();
    levelRoot = new THREE.Group();
    scene.add(levelRoot);
    resize();
    window.addEventListener('resize', resize);
  }

  // ステージを読み込む（前のステージの見た目を捨てる）
  function load(world, level) {
    while (levelRoot.children.length) levelRoot.remove(levelRoot.children[0]);
    applyTheme(level.theme);
    buildLevel(world, level);
    camX = level.start.x; camY = CFG.cam.minY;
  }

  function resize() {
    if (!renderer) return;
    const w = container.clientWidth || 640, h = container.clientHeight || 360;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }

  const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);

  // st: { hero, world, anim, shake:{i,t}|null, candidate, time, squash, got:[bool], flagsHit:[bool] }
  function update(dt, st) {
    const { hero, world, anim, shake } = st;
    // 折りの角度
    const prog = [];
    for (let i = 0; i < foldGroups.length; i++) {
      const fd = world.folds[i];
      let p = world.isOn(i) ? 1 : 0;
      if (anim && anim.i === i) { const e = ease(anim.t / CFG.fold.dur); p = anim.fold ? e : 1 - e; }
      prog[i] = p;
      const sgn = fd.axis === 'x' ? -fd.dir : fd.dir;
      let rot = sgn * Math.PI * p;
      if (shake && shake.i === i) rot += Math.sin(shake.t * 70) * 0.07 * (1 - shake.t / CFG.fold.shakeDur) * sgn;
      if (fd.axis === 'x') foldGroups[i].rotation.y = rot; else foldGroups[i].rotation.x = rot;
      // 折り目の点線：候補は金色に脈打つ
      const mk = markers[i].userData.mat;
      const hot = st.candidate === i || world.isOn(i);
      mk.color.setHex(hot ? (Math.sin(st.time * 8) > 0 ? 0xffa800 : 0xff6a00) : 0x8a7a66);
      // 裏面の足場は、半分以上めくれてから現れる（紙の裏側が見えるのと同じ）
      const showBack = p > 0.5;
      for (const m of backMeshes[i]) m.visible = showBack;
    }
    // アイテム
    for (const e of shardMeshes) {
      const idx = world.shards.indexOf(e.s);
      let vis = !st.got[idx];
      if (e.s.back >= 0) vis = vis && prog[e.s.back] > 0.5;
      e.m.visible = vis;
      e.m.rotation.y = st.time * 2.2;
      e.m.scale.y = 1.3 + Math.sin(st.time * 4 + idx) * 0.08;
    }
    for (const e of spikeMeshes) e.g.visible = world.spikeCell(e.sp) !== null || (anim && e.fi >= 0);
    flagMeshes.forEach((e, i) => {
      const hit = st.flagsHit[i];
      e.cm.color.setHex(hit ? 0xffb938 : 0xb8b2a5);
      e.cloth.rotation.y = Math.sin(st.time * 3 + i) * 0.25;
    });
    // 主人公
    let hx = hero.x, hy = hero.y, hz = 0;
    if (anim && anim.carried) {
      const fd = world.folds[anim.i];
      const e = ease(anim.t / CFG.fold.dur), p = anim.fold ? e : 1 - e;   // 折れた角度（1 = 完全に折れている）
      const d1 = anim.x1 - fd.f;                                          // 元の位置の折り目からの距離
      hx = fd.f + d1 * Math.cos(Math.PI * p);
      hz = Math.abs(d1) * Math.sin(Math.PI * p);
    }
    heroRoot.position.set(hx, hy, hz);
    heroRoot.scale.x = hero.face >= 0 ? 1 : -1;
    heroRoot.visible = !st.dead;
    // つぶれ・のび・走りのはずみ
    const speed = Math.abs(hero.vx);
    let sx = 1, sy = 1;
    if (!hero.ground) { const k = Math.min(0.25, Math.abs(hero.vy) * 0.018); sy = 1 + k; sx = 1 - k * 0.6; }
    else if (st.squash > 0) { sy = 1 - 0.32 * st.squash; sx = 1 + 0.28 * st.squash; }
    else if (speed > 0.5) { sy = 1 + Math.sin(st.time * 22) * 0.04; }
    heroBody.scale.set(sx, sy, 1);
    heroTail.rotation.z = Math.sin(st.time * (6 + speed)) * 0.25 + (hero.ground ? 0 : 0.35);
    // ゴール
    flag.userData.cloth.rotation.y = Math.sin(st.time * 3) * 0.25;
    if (bigShard) { bigShard.rotation.y = st.time * 1.6; bigShard.position.y = 4.0 + Math.sin(st.time * 2) * 0.2; }
    flagGlow.scale.setScalar(1 + Math.sin(st.time * 3) * 0.08);
    // カメラ
    const half = world.W / 2;
    const tx = Math.min(world.W - 11, Math.max(11, hx + hero.face * 2.2));
    const ty = Math.max(CFG.cam.minY, hy + 2.6);
    const k = 1 - Math.exp(-CFG.cam.smooth * dt);
    camX += (tx - camX) * k; camY += (ty - camY) * k;
    camera.position.set(camX, camY + 1.2, CFG.cam.dist);
    camera.lookAt(camX, camY, 0);
    sun.position.set(camX - 8, 18, 16); sun.target.position.set(camX, 3, 0); sun.target.updateMatrixWorld();
  }

  function snapCamera(x, y) { camX = Math.min(Math.max(x, 11), 1000); camY = Math.max(CFG.cam.minY, y + 2.6); }
  function render() { renderer.render(scene, camera); }
  return { init, load, update, render, resize, snapCamera };
})();
// ===== 入力・HUD・画面の出し入れ =====
const $ = id => document.getElementById(id);
const INPUT = { left: false, right: false, jumpHeld: false, jumpPressed: false, foldPressed: false, unfoldPressed: false, touch: false };
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyF: 'fold', KeyJ: 'fold', KeyU: 'unfold', ShiftLeft: 'unfold', ShiftRight: 'unfold',
};
let onPause = () => {}, onRetry = () => {};

function setKey(code, down) {
  const a = KEYMAP[code];
  if (!a) return false;
  if (a === 'left' || a === 'right') INPUT[a] = down;
  else if (a === 'jump') { if (down && !INPUT.jumpHeld) INPUT.jumpPressed = true; INPUT.jumpHeld = down; }
  else if (a === 'fold') { if (down) INPUT.foldPressed = true; }
  else if (a === 'unfold') { if (down) INPUT.unfoldPressed = true; }
  return true;
}
addEventListener('keydown', e => {
  if (e.repeat) { if (KEYMAP[e.code]) e.preventDefault(); return; }
  if (e.code === 'Escape') { onPause(); return; }
  if (e.code === 'KeyR') { onRetry(); return; }
  if (setKey(e.code, true)) e.preventDefault();
});
addEventListener('keyup', e => { if (setKey(e.code, false)) e.preventDefault(); });
addEventListener('blur', () => { INPUT.left = INPUT.right = INPUT.jumpHeld = false; });

// タッチボタン
function bindBtn(id, down, up) {
  const el = $(id);
  const on = e => { e.preventDefault(); INPUT.touch = true; document.body.classList.add('touch'); el.classList.add('down'); down(); };
  const off = e => { e.preventDefault(); el.classList.remove('down'); up && up(); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindBtn('bL', () => INPUT.left = true, () => INPUT.left = false);
bindBtn('bR', () => INPUT.right = true, () => INPUT.right = false);
bindBtn('bJ', () => { if (!INPUT.jumpHeld) INPUT.jumpPressed = true; INPUT.jumpHeld = true; }, () => INPUT.jumpHeld = false);
bindBtn('bF', () => INPUT.foldPressed = true);
bindBtn('bU', () => INPUT.unfoldPressed = true);
addEventListener('touchstart', () => { INPUT.touch = true; document.body.classList.add('touch'); }, { passive: true, once: true });
if (matchMedia('(pointer: coarse)').matches) { INPUT.touch = true; document.body.classList.add('touch'); }

// スマホが縦向きの間は案内（#rotate）を出してゲームを止める
const portrait = matchMedia('(orientation: portrait) and (pointer: coarse)');

// スマホではじめるとき、全画面にして横向きに固定してみる（できない端末では何もしない）
function tryLandscape() {
  const el = document.documentElement;
  if (!el.requestFullscreen) return;
  el.requestFullscreen().then(() => {
    if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
  }).catch(() => {});
}

const HUD = {
  show(name) {
    ['scTitle', 'scSelect', 'scPause', 'scClear', 'scEnding'].forEach(id => $(id).classList.toggle('on', id === name));
  },
  playing(on) { document.body.classList.toggle('playing', on); },
  stage(txt) { $('tagStage').textContent = txt; },
  shards(n, t) { $('tagShard').textContent = '◆ ' + n + '/' + t; },
  time(t) { $('tagTime').textContent = t.toFixed(1) + ' s'; },
  prompt(text, warn) {
    const p = $('prompt');
    if (!text) { p.style.display = 'none'; return; }
    p.style.display = 'block'; p.textContent = text; p.classList.toggle('warn', !!warn);
  },
  canFold(on) { document.body.classList.toggle('canfold', on); },
  toast(text) {
    const t = $('toast'); t.textContent = text; t.classList.add('on');
    clearTimeout(HUD._tt); HUD._tt = setTimeout(() => t.classList.remove('on'), 1500);
  },
};
// ===== ゲーム本体（状態・ループ・保存） =====
const SAVE_KEY = 'foldedWorld.save.v1';
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.stages) { s.abilities = s.abilities || {}; return s; } } catch (e) {}
  return { stages: {}, abilities: {} };
}
function writeSave(s) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} }
let save = loadSave();

const WORLD_NAME = { 1: 'ワールド1　草原の紙', 2: 'ワールド2　夕やけの紙', 3: 'ワールド3　夜の紙', 4: '最終ステージ', 5: 'ひみつ' };
const ABILITY_TEXT = {
  yfold: '新しい能力「横の折り目」を手に入れた！<br>高い足場を折り下ろしたり、崖を低くできる。',
  double: '新しい能力「二重折り」を手に入れた！<br>2か所を同時に折れる。（U / Shift で戻す）',
  final: '最後の大きな欠片を手に入れた！<br>最終ステージが開いた。',
};
const totalShards = () => Object.values(save.stages).reduce((n, s) => n + s.shards.filter(Boolean).length, 0);
const cleared = id => !!(save.stages[id] && save.stages[id].clear);
function unlocked(lv) {
  if (lv.needShards) return totalShards() >= lv.needShards;
  if (lv.world === 2) return cleared('1-3');
  if (lv.world === 3) return cleared('2-3');
  if (lv.world === 4) return cleared('3-3');
  return true;
}

let stageIdx = 0, level = LEVELS[0], world = new World(level);
let hero = newHero(level);
let state = 'title';          // title | select | play | pause | clear | ending
let anim = null;              // { i, fold, t, carried, x0, x1 }
let shake = null;             // { i, t }
let time = 0, clock = 0, foldCount = 0, squash = 0, candidate = -1;
let got = [], flagsHit = [], cp = null, deadT = 0, deaths = 0, foldStack = [];

GAME3D.init($('view'));

function resetRun() {
  world.mask = 0; anim = null; shake = null; deadT = 0; foldStack = [];
  hero = newHero(level);
  got = world.shards.map(() => false);
  flagsHit = world.flags.map(() => false);
  cp = null; time = 0; foldCount = 0; deaths = 0;
  GAME3D.snapCamera(hero.x, hero.y);
}
function loadStage(i) {
  stageIdx = i; level = LEVELS[i]; world = new World(level);
  GAME3D.load(world, level);
  resetRun();
  HUD.stage(level.id + '　' + level.name);
  document.body.classList.toggle('double', world.maxFolds > 1);
}
function enterPlay() { state = 'play'; HUD.show(null); HUD.playing(true); }
function startStage(i) { loadStage(i); enterPlay(); }

function respawn() {   // 落ちる・トゲ → 最後に取った旗から。折りも旗を取った時点に戻す
  deaths++;
  world.mask = cp ? cp.mask : 0;
  foldStack = cp ? cp.stack.slice() : [];
  anim = null; shake = null;
  hero = newHero(level, cp ? { x: cp.x, y: cp.y } : null);
  deadT = 0.35;
  GAME3D.snapCamera(hero.x, hero.y);
  HUD.toast(cp ? '旗から再開' : 'もういちど');
}

function pause(on) {
  if (state === 'play' && on !== false) { state = 'pause'; HUD.show('scPause'); }
  else if (state === 'pause' && on !== true) { state = 'play'; HUD.show(null); }
}
onPause = () => pause();
onRetry = () => { if (state === 'play' || state === 'pause') { resetRun(); enterPlay(); } };

// ---- ステージ選択 ----
function showSelect() {
  state = 'select'; HUD.playing(false);
  const box = $('cards'); box.innerHTML = '';
  const worlds = [1, 2, 3, 4, 5];
  worlds.forEach(wn => {
    const list = LEVELS.map((lv, i) => ({ lv, i })).filter(e => e.lv.world === wn);
    if (!list.length) return;
    const row = document.createElement('div'); row.className = 'wrow';
    const lab = document.createElement('div'); lab.className = 'wlab'; lab.textContent = WORLD_NAME[wn];
    row.appendChild(lab);
    list.forEach(({ lv, i }) => {
      const sv = save.stages[lv.id];
      const ok = unlocked(lv);
      const b = document.createElement('button');
      b.className = 'card' + (sv && sv.clear ? ' done' : '') + (ok ? '' : ' lock');
      const n = sv ? sv.shards.filter(Boolean).length : 0;
      const stars = '◆'.repeat(n) + '◇'.repeat(lv.shards.length - n);
      let info = sv && sv.clear ? 'クリア　' + sv.best.toFixed(1) + ' 秒' : '未クリア';
      if (!ok) info = lv.needShards ? `小さな欠片 ${lv.needShards} 個で開く（いま ${totalShards()}）` : '前のワールドをクリアで開く';
      b.innerHTML = `<b>${lv.id}</b><span class="nm">${ok ? lv.name : '？？？'}</span><span class="st">${stars}</span><span class="ht">${info}</span>`;
      if (ok) b.addEventListener('click', () => { if (INPUT.touch) tryLandscape(); startStage(i); });
      row.appendChild(b);
    });
    box.appendChild(row);
  });
  HUD.show('scSelect');
}

$('btnStart').addEventListener('click', () => { if (INPUT.touch) tryLandscape(); showSelect(); });
$('btnResume').addEventListener('click', () => pause(false));
$('btnRetry').addEventListener('click', () => onRetry());
$('btnToSelect1').addEventListener('click', showSelect);
$('btnToSelect2').addEventListener('click', showSelect);
$('btnEndSel').addEventListener('click', showSelect);
$('btnAgain').addEventListener('click', () => startStage(stageIdx));
$('btnNext').addEventListener('click', () => {
  let n = stageIdx + 1;
  while (n < LEVELS.length && (!unlocked(LEVELS[n]) || LEVELS[n].needShards)) n++;
  startStage(n < LEVELS.length ? n : stageIdx);
});

const WHY = {
  overlap: '紙が重なって折れない', onTab: '乗っている紙は折れない', void: '戻すと足場がなくなる',
  compat: 'その折りとは同時に折れない', onLayer: '乗っている紙は戻せない', max: 'これ以上は同時に折れない',
};

function startFold(i) { anim = { i, fold: true, t: 0, carried: false, x0: hero.x, x1: hero.x }; foldCount++; }
function startUnfold(i) {
  const r = canUnfold(world, i, hero.x, hero.y);
  if (r.ok) { anim = { i, fold: false, t: 0, carried: r.carried, x0: hero.x, x1: r.nx }; return true; }
  shake = { i, t: 0 }; HUD.toast(WHY[r.why] || '紙が重なって戻せない');
  return false;
}

// F：いちばん近い「折れる」折り目を折る。なければ、いちばん新しく折ったものを戻す。U / Shift：戻す
function tryFold() {
  if (anim || !hero.ground) return;
  let best = -1, bestD = 1e9, blocked = -1, why = '';
  for (let i = 0; i < world.folds.length; i++) {
    if (world.isOn(i)) continue;
    const r = canFold(world, i, hero.x, hero.y), d = hingeDist(world.folds[i], hero.x, hero.y);
    if (r.ok) { if (d < bestD) { bestD = d; best = i; } }
    else if (['overlap', 'onTab', 'compat'].includes(r.why) && blocked < 0) { blocked = i; why = r.why; }
  }
  if (best >= 0) { startFold(best); return; }
  if (foldStack.length) { startUnfold(foldStack[foldStack.length - 1]); return; }
  if (blocked >= 0) { shake = { i: blocked, t: 0 }; HUD.toast(WHY[why]); }
}
function tryUnfold() {
  if (anim || !hero.ground || !foldStack.length) return;
  startUnfold(foldStack[foldStack.length - 1]);
}

function updateCandidate() {
  candidate = -1;
  if (anim) return;
  let bestD = 1e9;
  for (let i = 0; i < world.folds.length; i++) {
    if (world.isOn(i)) continue;
    const r = canFold(world, i, hero.x, hero.y);
    if (r.ok || ['overlap', 'onTab', 'compat'].includes(r.why)) {
      const d = hingeDist(world.folds[i], hero.x, hero.y);
      if (d < bestD) { bestD = d; candidate = i; }
    }
  }
  if (candidate < 0 && foldStack.length) candidate = foldStack[foldStack.length - 1];
}

function collectItems() {
  const cx = hero.x, cy = hero.y + 0.75;
  world.shards.forEach((s, i) => {
    if (got[i]) return;
    const c = world.itemCell(s);
    if (!c) return;
    if (Math.hypot(c[0] + 0.5 - cx, c[1] + 0.5 - cy) < CFG.item.shardR) { got[i] = true; HUD.toast('小さな欠片をひろった！'); }
  });
  world.flags.forEach((f, i) => {
    if (flagsHit[i] || !hero.ground || anim) return;
    if (Math.hypot(f.x - hero.x, f.y + 0.5 - cy) < CFG.item.flagR) {
      flagsHit[i] = true;
      cp = { x: f.x, y: f.y, mask: world.mask, stack: foldStack.slice() };
      HUD.toast('チェックポイント');
    }
  });
}

function clearStage() {
  state = 'clear'; HUD.playing(false);
  const n = got.filter(Boolean).length;
  const old = save.stages[level.id] || { clear: false, best: 1e9, shards: level.shards.map(() => false) };
  save.stages[level.id] = {
    clear: true, best: Math.min(old.best, time),
    shards: level.shards.map((_, i) => !!(old.shards[i] || got[i])),
  };
  let abilityMsg = '';
  if (level.big) { save.abilities[level.big] = true; abilityMsg = '<br><br>◆◆◆ ' + ABILITY_TEXT[level.big] + ' ◆◆◆'; }
  writeSave(save);
  $('clearInfo').innerHTML = `${level.id} ${level.name}<br>タイム ${time.toFixed(1)} 秒　／　折った回数 ${foldCount} 回<br>小さな欠片 ${n}/${level.shards.length}　／　やり直し ${deaths} 回${abilityMsg}`;
  const hasNext = LEVELS.some((lv, i) => i > stageIdx && unlocked(lv) && !lv.needShards);
  $('btnNext').style.display = hasNext && !level.final ? '' : 'none';
  if (level.final) {
    const sum = Object.values(save.stages).reduce((t, s) => t + (s.clear ? s.best : 0), 0);
    $('endInfo').innerHTML = `最終ステージ クリア！<br>小さな欠片 ${totalShards()} / ${LEVELS.reduce((a, l) => a + l.shards.length, 0)}　／　最短タイムの合計 ${sum.toFixed(1)} 秒`;
    HUD.show('scEnding'); state = 'ending';
  } else HUD.show('scClear');
}

function update(dt) {
  time += dt;
  if (deadT > 0) deadT -= dt;
  if (anim) {
    anim.t += dt;
    if (anim.t >= CFG.fold.dur) {
      if (anim.fold) { world.mask |= 1 << anim.i; foldStack.push(anim.i); }
      else { world.mask &= ~(1 << anim.i); foldStack = foldStack.filter(k => k !== anim.i); }
      if (anim.carried) { hero.x = anim.x1; hero.vx = 0; hero.vy = 0; }
      anim = null;
    }
  } else {
    if (INPUT.unfoldPressed) tryUnfold();
    else if (INPUT.foldPressed) tryFold();
    if (!anim) {
      stepHero(world, hero, INPUT, dt);
      if (hero.landed) squash = Math.max(squash, hero.landed);
      if (hero.y < CFG.hero.deathY || hitsSpike(world, hero)) respawn();
      else {
        collectItems();
        if (Math.abs(hero.x - level.goal.x) < 0.9 && Math.abs(hero.y - level.goal.y) < 1.2) clearStage();
      }
    }
  }
  INPUT.foldPressed = false; INPUT.unfoldPressed = false; INPUT.jumpPressed = false;
  if (shake) { shake.t += dt; if (shake.t > CFG.fold.shakeDur) shake = null; }
  squash = Math.max(0, squash - dt * 5);
  updateCandidate();
  // ガイド表示
  if (anim) HUD.prompt('');
  else if (candidate >= 0 && !world.isOn(candidate)) {
    const r = canFold(world, candidate, hero.x, hero.y);
    HUD.prompt(r.ok ? 'F：折る' : WHY[r.why], !r.ok);
  } else if (foldStack.length) {
    const top = foldStack[foldStack.length - 1], r = canUnfold(world, top, hero.x, hero.y);
    HUD.prompt(r.ok ? (r.carried ? 'F：元に戻す（紙ごと運ばれる）' : 'F：元に戻す') : WHY[r.why] || '重なっていて戻せない', !r.ok);
  } else HUD.prompt('');
  HUD.canFold(!anim && candidate >= 0);
  HUD.time(time);
  HUD.shards(got.filter(Boolean).length, got.length);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; clock += dt;
  if (state === 'play' && !portrait.matches) {
    let rest = dt;                       // 物理は 1/120 秒刻み
    while (rest > 1e-6) { const s = Math.min(rest, 1 / 120); update(s); rest -= s; if (state !== 'play') break; }
  }
  GAME3D.update(dt, { hero, world, anim, shake, candidate, time: clock, squash, got, flagsHit, dead: false });
  GAME3D.render();
  requestAnimationFrame(frame);
}
loadStage(0);
requestAnimationFrame(frame);

// 検証用に外から見られるようにしておく（遊びには影響しない）
window.__game = { get world() { return world; }, get hero() { return hero; }, get state() { return state; }, get got() { return got; }, startStage, showSelect, LEVELS, get save() { return save; } };

</script>
